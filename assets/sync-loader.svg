<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="800" height="48" role="img" aria-label="Next episode loading">
  <defs>
    <pattern id="lTone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141414" opacity=".08"/>
    </pattern>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; font-style: italic; font-weight: 700; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    .cur { animation: blink .8s step-end infinite; }
    .p { animation: pulse 1.3s ease-in-out infinite; }
  </style>

  <rect width="800" height="48" fill="#f7f1e3"/>
  <rect width="800" height="48" fill="url(#lTone)"/>

  <!-- red stamp label -->
  <g transform="translate(20,10)">
    <rect width="210" height="28" fill="#e60012" stroke="#141414" stroke-width="3"/>
    <text class="disp" x="105" y="21" text-anchor="middle" fill="#ffffff" font-size="15" letter-spacing="3">NEXT EPISODE</text>
  </g>

  <text class="disp" x="250" y="32" fill="#141414" font-size="18" letter-spacing="3">LOADING<span class="cur">...</span></text>
  <text class="sans p" x="400" y="31" fill="#e60012" font-size="13" letter-spacing="2">STAY TUNED</text>

  <!-- ink progress bar -->
  <g transform="translate(520,14)">
    <rect width="240" height="20" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <rect x="4" y="4" width="0" height="12" fill="#ff6a00">
      <animate attributeName="width" values="0;40;150;232;232" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- brush shine -->
    <rect x="-30" y="4" width="30" height="12" fill="#ffd166" opacity=".7">
      <animate attributeName="x" values="-30;240" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="2" y="2" width="796" height="44" fill="none" stroke="#141414" stroke-width="5"/>
</svg>
