<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 88" width="800" height="88" role="img" aria-label="Sync loader - awaiting data">
  <defs>
    <linearGradient id="sTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="sFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#56d4dd"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }
    @keyframes sBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes sPulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    .sCur { animation: sBlink 0.95s step-end infinite; }
    .sDot { animation: sPulse 1.5s ease-in-out infinite; }
  </style>

  <rect width="800" height="88" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="87" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>

  <circle cx="28" cy="26" r="5" fill="#3fb950" class="sDot" filter="url(#sGlow)"/>
  <text class="mono" x="44" y="31" fill="#56d4dd" font-size="14" letter-spacing="1">DATA_STREAM :: AWAITING_SYNC<tspan class="sCur" fill="#c084fc">_</tspan></text>
  <text class="mono" x="776" y="31" text-anchor="end" fill="#8b949e" font-size="11">cron.job // idle</text>

  <!-- looping progress -->
  <rect x="24" y="46" width="752" height="14" rx="7" fill="url(#sTrack)" stroke="#22d3ee" stroke-opacity="0.35"/>
  <rect x="26" y="48" width="0" height="10" rx="5" fill="url(#sFill)" filter="url(#sGlow)">
    <animate attributeName="width" values="0;200;420;748;748;0" keyTimes="0;0.25;0.5;0.75;0.92;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="26" y="48" width="60" height="10" rx="5" fill="url(#sShine)">
    <animate attributeName="x" values="26;716;26" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <text class="mono" x="24" y="78" fill="#8b949e" font-size="10" letter-spacing="1">[ GITHUB_ACTIONS ]&#160;&#160;buffer: 0 items&#160;&#160;//&#160;&#160;next pull: T-60s</text>
  <text class="mono" x="776" y="78" text-anchor="end" fill="#c084fc" font-size="10">STATUS: STANDBY</text>
</svg>
