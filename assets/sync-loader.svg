<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" width="800" height="44" role="img" aria-label="Next episode loading">
  <defs>
    <linearGradient id="lProg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#e01b24"/>
    </linearGradient>
    <linearGradient id="lBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff6e8"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </linearGradient>
    <filter id="lG" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; font-style: italic; font-weight: 700; }
    @keyframes lB { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes lP { 0%,100% { opacity:.5; } 50% { opacity:1; } }
    .cur { animation: lB .8s step-end infinite; }
    .p { animation: lP 1.3s ease-in-out infinite; }
  </style>

  <rect width="800" height="44" fill="#050508"/>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="2" opacity=".1">
    <line x1="620" y1="6" x2="790" y2="16"/>
    <line x1="640" y1="38" x2="790" y2="30"/>
  </g>

  <!-- skew label -->
  <g transform="translate(24,8) skewX(-10)">
    <rect width="220" height="28" fill="#e01b24"/>
    <text class="disp" x="110" y="21" text-anchor="middle" fill="#ffffff" font-size="15" letter-spacing="3">NEXT EPISODE</text>
  </g>

  <text class="disp" x="262" y="28" fill="#ffd54f" font-size="16" letter-spacing="3" filter="url(#lG)">LOADING<span class="cur">...</span></text>
  <text class="sans p" x="408" y="27" fill="#2ec4b6" font-size="12" letter-spacing="2">STAY TUNED</text>

  <!-- anime progress bar -->
  <g transform="translate(545,14)">
    <rect width="210" height="16" fill="#12101a" stroke="#ff7a1a" stroke-width="2" transform="skewX(-12)"/>
    <rect x="3" y="3" width="0" height="10" fill="url(#lProg)" transform="skewX(-12)">
      <animate attributeName="width" values="0;36;130;204;204" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-40" y="0" width="40" height="16" fill="url(#lBeam)" opacity=".7" transform="skewX(-12)">
      <animate attributeName="x" values="-40;230" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="p">
    <polygon points="768,22 778,16 778,28" fill="#ff7a1a"/>
    <polygon points="782,22 792,16 792,28" fill="#ffd54f"/>
  </g>

  <rect x="0" y="41" width="800" height="3" fill="url(#lBeam)" opacity=".55"/>
</svg>
