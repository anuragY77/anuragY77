<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="800" height="90" role="img" aria-label="Episode title card: Projects">
  <defs>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="50%" stop-color="#e01b24"/>
      <stop offset="100%" stop-color="#2ec4b6"/>
    </linearGradient>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    @keyframes sl { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    @keyframes fl { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    .a { animation: sl 2s ease-in-out infinite; }
    .f { animation: fl 1.4s ease-in-out infinite; }
  </style>
  <rect width="800" height="90" fill="#0a0a10"/>
  <g stroke="#ffffff" stroke-width="2" opacity=".12">
    <line x1="500" y1="10" x2="780" y2="30"/>
    <line x1="520" y1="40" x2="780" y2="55"/>
    <line x1="540" y1="70" x2="780" y2="80"/>
  </g>
  <g transform="translate(28,14) skewX(-10)">
    <rect width="72" height="44" fill="url(#t3)"/>
    <text class="disp" x="36" y="20" text-anchor="middle" fill="#0a0a10" font-size="11" letter-spacing="2">EPISODE</text>
    <text class="disp" x="36" y="40" text-anchor="middle" fill="#ffffff" font-size="22">03</text>
  </g>
  <text class="sans" x="122" y="30" fill="#ffd54f" font-size="13" font-weight="700" letter-spacing="4" font-style="italic">MISSIONS — THOSE WHO NEVER BACK DOWN</text>
  <text class="disp" x="120" y="60" fill="#ffffff" font-size="30" letter-spacing="4">FEATURED PROJECTS</text>
  <rect x="120" y="64" width="360" height="4" fill="url(#t3)" class="a"/>
  <!-- three character energy chips -->
  <g class="sans" font-size="10" font-weight="700">
    <g transform="translate(120,74) skewX(-8)"><rect width="140" height="14" fill="#ff7a1a"/><text x="70" y="11" text-anchor="middle" fill="#0a0a10">NARUTO · NEVER GIVE UP</text></g>
    <g transform="translate(270,74) skewX(-8)"><rect width="130" height="14" fill="#e01b24"/><text x="65" y="11" text-anchor="middle" fill="#fff">ONE PIECE · DREAM</text></g>
    <g transform="translate(410,74) skewX(-8)"><rect width="150" height="14" fill="#2ec4b6"/><text x="75" y="11" text-anchor="middle" fill="#0a0a10">DEMON SLAYER · FIGHT ON</text></g>
  </g>
  <circle cx="770" cy="36" r="5" fill="#e01b24" class="f"/>
</svg>
