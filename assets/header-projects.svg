<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 64" width="800" height="64" role="img" aria-label="Section header: Featured Modules">
  <defs>
    <linearGradient id="h2Line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h2Text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#56d4dd"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="h2Beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="h2Glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="h2Type">
      <rect x="70" y="14" width="0" height="40">
        <animate attributeName="width" from="0" to="430" dur="2.2s" fill="freeze" repeatCount="1"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    @keyframes hBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes hDot { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .hCur { animation: hBlink 0.9s step-end infinite; }
    .hDot { animation: hDot 1.4s ease-in-out infinite .3s; }
  </style>

  <rect width="800" height="64" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="63" fill="none" stroke="#c084fc" stroke-opacity="0.4"/>

  <g stroke="#c084fc" stroke-width="1.6" fill="none" opacity="0.9" filter="url(#h2Glow)">
    <path d="M10,16 L10,6 L26,6"/>
    <path d="M10,48 L10,58 L26,58"/>
    <path d="M774,6 L790,6 L790,16"/>
    <path d="M790,48 L790,58 L774,58"/>
  </g>

  <text class="hDot" x="40" y="40" fill="#3fb950" font-family="Consolas,monospace" font-size="16" filter="url(#h2Glow)">&#9679;</text>

  <g clip-path="url(#h2Type)">
    <text x="70" y="41" fill="url(#h2Text)" font-family="Consolas, 'Cascadia Code', monospace" font-size="26" font-weight="700" letter-spacing="3" filter="url(#h2Glow)">// FEATURED_MODULES</text>
  </g>
  <text class="hCur" x="508" y="41" fill="#c084fc" font-family="Consolas, monospace" font-size="26" font-weight="700">_</text>

  <text x="755" y="38" text-anchor="end" fill="#22d3ee" font-family="Consolas, monospace" font-size="11" opacity="0.75" letter-spacing="1">0x02</text>

  <rect x="10" y="61" width="780" height="3" fill="url(#h2Line)" opacity="0.9"/>
  <rect x="10" y="61" width="70" height="3" fill="url(#h2Beam)">
    <animate attributeName="x" values="720;10;720" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
