<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 96" width="800" height="96" role="img" aria-label="Episode title card: Projects">
  <defs>
    <pattern id="tone3" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141414" opacity=".07"/>
    </pattern>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; font-style: italic; font-weight: 700; }
    .tag { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; }
    @keyframes stamp { 0% { transform: scale(1.6) rotate(-18deg); opacity:0; } 60% { transform: scale(.95) rotate(-8deg); opacity:1; } 100% { transform: scale(1) rotate(-8deg); opacity:1; } }
    @keyframes under { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .stamp { transform-box: fill-box; transform-origin: center; animation: stamp .5s ease-out both; }
    .under { transform-origin: left center; animation: under .6s .2s ease-out both; }
  </style>

  <rect width="800" height="96" fill="#f7f1e3"/>
  <rect width="800" height="96" fill="url(#tone3)"/>

  <g stroke="#141414" stroke-width="2" opacity=".18" stroke-linecap="round">
    <line x1="560" y1="12" x2="780" y2="28"/>
    <line x1="580" y1="40" x2="780" y2="54"/>
    <line x1="600" y1="68" x2="780" y2="76"/>
  </g>

  <g transform="translate(52,40)"><g class="stamp">
    <circle r="28" fill="none" stroke="#e60012" stroke-width="4"/>
    <circle r="22" fill="#e60012"/>
    <text class="disp" x="0" y="-4" text-anchor="middle" fill="#f7f1e3" font-size="9" letter-spacing="1">EP</text>
    <text class="disp" x="0" y="14" text-anchor="middle" fill="#ffffff" font-size="20">03</text></g></g>

  <text class="sans" x="98" y="28" fill="#e60012" font-size="13" letter-spacing="2">Missions — those who never back down</text>
  <text class="disp" x="96" y="62" fill="#141414" font-size="34" letter-spacing="3">FEATURED PROJECTS</text>
  <rect class="under" x="96" y="68" width="380" height="5" fill="#e60012"/>

  <!-- character mode tags (manga stickers) -->
  <g class="tag" font-size="10">
    <g transform="translate(96,78)">
      <rect width="148" height="16" fill="#ff6a00" stroke="#141414" stroke-width="2"/>
      <text x="74" y="12" text-anchor="middle" fill="#141414">NARUTO Â· NEVER GIVE UP</text>
    </g>
    <g transform="translate(254,78)">
      <rect width="132" height="16" fill="#e60012" stroke="#141414" stroke-width="2"/>
      <text x="66" y="12" text-anchor="middle" fill="#ffffff">ONE PIECE Â· DREAM</text>
    </g>
    <g transform="translate(396,78)">
      <rect width="156" height="16" fill="#0d9488" stroke="#141414" stroke-width="2"/>
      <text x="78" y="12" text-anchor="middle" fill="#ffffff">DEMON SLAYER Â· FIGHT ON</text>
    </g>
  </g>

  <rect x="2" y="2" width="796" height="92" fill="none" stroke="#141414" stroke-width="5"/>
</svg>
