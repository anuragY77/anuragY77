<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Portfolio project — Demon Slayer mode, set your heart ablaze">
  <defs>
    <pattern id="dTone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141414" opacity=".08"/>
    </pattern>
    <filter id="dInk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes fl { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 1.6s ease-in-out infinite; }
    .f { animation: fl 1.4s ease-in-out infinite; }
  </style>

  <rect width="800" height="200" fill="#f7f1e3"/>
  <rect width="800" height="200" fill="url(#dTone)"/>

  <!-- left teal slash -->
  <polygon points="0,0 250,0 210,200 0,200" fill="#0d9488"/>
  <g stroke="#141414" stroke-width="3" opacity=".25" stroke-linecap="round">
    <line x1="20" y1="30" x2="200" y2="50"/>
    <line x1="10" y1="90" x2="190" y2="100"/>
    <line x1="20" y1="150" x2="180" y2="155"/>
  </g>

  <!-- flame / hanafuda style emblem -->
  <g transform="translate(110,100)" class="pop">
    <circle r="52" fill="#f7f1e3" stroke="#141414" stroke-width="5"/>
    <path d="M0,-36 Q18,-14 10,4 Q28,10 18,28 Q6,40 -6,34 Q-24,40 -22,20 Q-34,4 -18,-8 Q-22,-28 0,-36 Z" fill="#e60012" stroke="#141414" stroke-width="3"/>
    <path d="M0,-14 Q8,-2 4,8 Q12,14 4,22 Q0,28 -6,22 Q-14,14 -6,6 Q-10,-4 0,-14 Z" fill="#ffd166"/>
  </g>
  <text class="disp" x="110" y="178" text-anchor="middle" fill="#141414" font-size="13" letter-spacing="3">DEMON SLAYER MODE</text>

  <g transform="translate(700,28) rotate(-8)">
    <rect x="-86" y="-15" width="172" height="30" fill="#0d9488" stroke="#141414" stroke-width="3"/>
    <text class="disp" x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="13" letter-spacing="1">SET YOUR HEART ABLAZE</text>
  </g>

  <text class="disp" x="280" y="78" fill="#141414" font-size="40" letter-spacing="2">portfolio</text>
  <rect x="280" y="88" width="200" height="5" fill="#0d9488"/>

  <text class="sans" x="280" y="118" fill="#141414" font-size="15" font-weight="600">Personal site with Next.js — dark, fast, fully animated.</text>

  <g transform="translate(280,132)" filter="url(#dInk)">
    <rect width="460" height="40" rx="18" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <polygon points="20,40 8,58 48,42" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <text class="sans" x="230" y="26" text-anchor="middle" fill="#141414" font-size="14" font-style="italic" font-weight="700">"Total Concentration: constant performance."</text>
  </g>

  <g class="sans" font-size="11" font-weight="700">
    <g transform="translate(280,178)"><rect width="76" height="16" fill="#141414"/><text x="38" y="12" text-anchor="middle" fill="#f7f1e3">TypeScript</text></g>
    <g transform="translate(364,178)"><rect width="64" height="16" fill="#141414"/><text x="32" y="12" text-anchor="middle" fill="#f7f1e3">Next.js</text></g>
    <g transform="translate(436,178)"><rect width="84" height="16" fill="#141414"/><text x="42" y="12" text-anchor="middle" fill="#f7f1e3">Tailwind CSS</text></g>
  </g>

  <rect x="3" y="3" width="794" height="194" fill="none" stroke="#141414" stroke-width="7"/>
</svg>
