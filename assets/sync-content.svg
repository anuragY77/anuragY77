<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 78" width="800" height="78" role="img" aria-label="Content reel developing - awaiting first sync">
  <defs>
    <pattern id="crlTone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141414" opacity=".08"/>
    </pattern>
    <pattern id="crlHoles" width="16" height="78" patternUnits="userSpaceOnUse">
      <rect x="4" y="8" width="8" height="10" rx="2" fill="#f7f1e3" stroke="#141414" stroke-width="1.5"/>
      <rect x="4" y="34" width="8" height="10" rx="2" fill="#f7f1e3" stroke="#141414" stroke-width="1.5"/>
      <rect x="4" y="60" width="8" height="10" rx="2" fill="#f7f1e3" stroke="#141414" stroke-width="1.5"/>
    </pattern>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; font-style: italic; font-weight: 700; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    @keyframes frames { from { transform: translateX(0); } to { transform: translateX(-96px); } }
    @keyframes dev { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @keyframes blip2 { 0%,40% { opacity:1; } 50%,100% { opacity:.2; } }
    .fr { animation: frames 2.2s linear infinite; }
    .dv { animation: dev 1.4s ease-in-out infinite; }
    .bl2 { animation: blip2 1.1s step-end infinite; }
  </style>

  <rect width="800" height="78" fill="#f7f1e3"/>
  <rect width="800" height="78" fill="url(#crlTone)"/>

  <!-- film strip left -->
  <g transform="translate(14,8)">
    <rect width="168" height="62" fill="#141414"/>
    <rect x="0" y="0" width="16" height="62" fill="url(#crlHoles)"/>
    <rect x="152" y="0" width="16" height="62" fill="url(#crlHoles)"/>
    <clipPath id="crlClip"><rect x="20" y="6" width="128" height="50"/></clipPath>
    <g clip-path="url(#crlClip)">
      <g class="fr">
        <!-- repeating frames -->
        <g>
          <rect x="20" y="6" width="44" height="50" fill="#f7f1e3" stroke="#ff6a00" stroke-width="2"/>
          <rect x="28" y="16" width="28" height="5" fill="#ff6a00"/>
          <rect x="28" y="26" width="20" height="5" fill="#141414" opacity=".4"/>
          <rect x="68" y="6" width="44" height="50" fill="#f7f1e3" stroke="#f0b429" stroke-width="2"/>
          <rect x="76" y="16" width="28" height="5" fill="#f0b429"/>
          <rect x="76" y="26" width="24" height="5" fill="#141414" opacity=".4"/>
          <rect x="116" y="6" width="44" height="50" fill="#f7f1e3" stroke="#e60012" stroke-width="2"/>
          <rect x="124" y="16" width="28" height="5" fill="#e60012"/>
          <rect x="124" y="26" width="16" height="5" fill="#141414" opacity=".4"/>
          <rect x="164" y="6" width="44" height="50" fill="#f7f1e3" stroke="#ff6a00" stroke-width="2"/>
          <rect x="172" y="16" width="28" height="5" fill="#ff6a00"/>
          <rect x="172" y="26" width="22" height="5" fill="#141414" opacity=".4"/>
        </g>
      </g>
    </g>
    <!-- center play mark -->
    <polygon points="76,22 76,46 100,34" fill="#f7f1e3" stroke="#141414" stroke-width="2" class="dv"/>
  </g>

  <!-- REEL badge -->
  <g transform="translate(200,14)">
    <rect width="92" height="22" rx="3" fill="#ff6a00" stroke="#141414" stroke-width="2.5"/>
    <text class="disp" x="46" y="16" text-anchor="middle" fill="#ffffff" font-size="12" letter-spacing="2">CONTENT</text>
  </g>

  <text class="disp" x="200" y="56" fill="#141414" font-size="20" letter-spacing="3">DEVELOPING REEL</text>
  <text class="sans" x="430" y="55" fill="#ff6a00" font-size="13" letter-spacing="1.5">posts loading…</text>

  <!-- status panel -->
  <g transform="translate(560,22)">
    <rect width="220" height="36" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <!-- orange progress ticks -->
    <g transform="translate(10,8)">
      <rect width="14" height="10" fill="#ff6a00"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="18" width="14" height="10" fill="#ff6a00"><animate attributeName="opacity" values="1;.2;1" dur="1s" begin=".15s" repeatCount="indefinite"/></rect>
      <rect x="36" width="14" height="10" fill="#ff6a00"><animate attributeName="opacity" values="1;.2;1" dur="1s" begin=".3s" repeatCount="indefinite"/></rect>
      <rect x="54" width="14" height="10" fill="#f0b429"><animate attributeName="opacity" values="1;.2;1" dur="1s" begin=".45s" repeatCount="indefinite"/></rect>
      <rect x="72" width="14" height="10" fill="#f0b429" opacity=".35"/>
      <rect x="90" width="14" height="10" fill="#141414" opacity=".15"/>
      <rect x="108" width="14" height="10" fill="#141414" opacity=".15"/>
      <text class="mono" x="132" y="10" fill="#141414" font-size="10">0%</text>
    </g>
    <text class="disp" x="10" y="30" fill="#141414" font-size="11" letter-spacing="1.5">AWAITING FIRST SYNC<span class="bl2">_</span></text>
  </g>

  <rect x="2" y="2" width="796" height="74" fill="none" stroke="#141414" stroke-width="5"/>
</svg>
