<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Anime character status screen">
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#141018"/>
    </linearGradient>
    <linearGradient id="sBar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="sBar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="sBar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ae582"/>
      <stop offset="100%" stop-color="#2ec4b6"/>
    </linearGradient>
    <linearGradient id="sBar4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="sBar5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff3b5c"/>
    </linearGradient>
    <filter id="sGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sAvatar"><circle cx="110" cy="150" r="52"/></clipPath>
    <radialGradient id="sG" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes sFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes sBlink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes sPulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    .bar { transform-origin: left center; animation: sFill 1.2s ease-out both; }
    .cur { animation: sBlink 1s step-end infinite; }
    .p { animation: sPulse 1.6s ease-in-out infinite; }
  </style>

  <rect width="800" height="300" fill="url(#sBg)"/>
  <rect width="800" height="300" fill="url(#sG)"/>
  <rect x="4" y="4" width="792" height="292" fill="none" stroke="#ffd166" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="10" y="10" width="780" height="280" fill="none" stroke="#ff7a1a" stroke-opacity="0.3" stroke-dasharray="6 6"/>

  <!-- header -->
  <rect x="24" y="22" width="8" height="18" fill="#ff7a1a"/>
  <text x="42" y="37" fill="#ffd166" font-family="Consolas,monospace" font-size="13" font-weight="700" letter-spacing="3">CHARACTER_STATUS // ステータス</text>
  <text x="776" y="37" text-anchor="end" fill="#7ae582" font-family="Consolas,monospace" font-size="11" letter-spacing="2">LV.MAX<span class="cur" fill="#ff7a1a">_</span></text>
  <line x1="24" y1="48" x2="776" y2="48" stroke="#ffd166" stroke-opacity="0.35"/>

  <!-- left: character portrait card -->
  <g>
    <circle cx="110" cy="150" r="58" fill="none" stroke="#7ae582" stroke-width="1.5" stroke-dasharray="4 6" class="p"/>
    <circle cx="110" cy="150" r="52" fill="#1a1410" stroke="#ffd166" stroke-width="2.5"/>
    <image href="data:image/jpeg;base64," x="58" y="98" width="104" height="104" clip-path="url(#sAvatar)" preserveAspectRatio="xMidYMid slice"/>
    <text x="110" y="228" text-anchor="middle" fill="#f0f0f5" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="15" font-weight="800" filter="url(#sGlow)">ANURAG</text>
    <text x="110" y="246" text-anchor="middle" fill="#2ec4b6" font-family="Consolas,monospace" font-size="10" letter-spacing="2">PROTAGONIST</text>
    <text x="110" y="264" text-anchor="middle" fill="#ffd166" font-family="Consolas,monospace" font-size="10">CLASS: FULL_STACK</text>
  </g>

  <!-- divider -->
  <line x1="195" y1="62" x2="195" y2="278" stroke="#ffd166" stroke-opacity="0.25"/>
  <circle cx="195" cy="170" r="4" fill="#ff7a1a" class="p"/>

  <!-- right: stat bars -->
  <g font-family="Consolas,monospace">
    <!-- PYTHON / STR -->
    <text x="225" y="80" fill="#f0f0f5" font-size="12" font-weight="700">PYTHON</text>
    <text x="760" y="80" text-anchor="end" fill="#ff7a1a" font-size="11" font-weight="700">92</text>
    <rect x="225" y="88" width="535" height="10" rx="2" fill="#1e1e28"/>
    <rect class="bar" x="225" y="88" width="492" height="10" rx="2" fill="url(#sBar1)" style="animation-delay:.1s"/>

    <!-- TypeScript / INT -->
    <text x="225" y="122" fill="#f0f0f5" font-size="12" font-weight="700">TYPESCRIPT</text>
    <text x="760" y="122" text-anchor="end" fill="#ffd166" font-size="11" font-weight="700">88</text>
    <rect x="225" y="130" width="535" height="10" rx="2" fill="#1e1e28"/>
    <rect class="bar" x="225" y="130" width="471" height="10" rx="2" fill="url(#sBar5)" style="animation-delay:.25s"/>

    <!-- React / SPD -->
    <text x="225" y="164" fill="#f0f0f5" font-size="12" font-weight="700">REACT</text>
    <text x="760" y="164" text-anchor="end" fill="#2ec4b6" font-size="11" font-weight="700">85</text>
    <rect x="225" y="172" width="535" height="10" rx="2" fill="#1e1e28"/>
    <rect class="bar" x="225" y="172" width="455" height="10" rx="2" fill="url(#sBar4)" style="animation-delay:.4s"/>

    <!-- Node / CHA -->
    <text x="225" y="206" fill="#f0f0f5" font-size="12" font-weight="700">NODE</text>
    <text x="760" y="206" text-anchor="end" fill="#7ae582" font-size="11" font-weight="700">80</text>
    <rect x="225" y="214" width="535" height="10" rx="2" fill="#1e1e28"/>
    <rect class="bar" x="225" y="214" width="428" height="10" rx="2" fill="url(#sBar3)" style="animation-delay:.55s"/>

    <!-- SQL / DEV -->
    <text x="225" y="248" fill="#f0f0f5" font-size="12" font-weight="700">SQL</text>
    <text x="760" y="248" text-anchor="end" fill="#ff3b5c" font-size="11" font-weight="700">75</text>
    <rect x="225" y="256" width="535" height="10" rx="2" fill="#1e1e28"/>
    <rect class="bar" x="225" y="256" width="401" height="10" rx="2" fill="url(#sBar2)" style="animation-delay:.7s"/>
  </g>

  <!-- tags row -->
  <text x="225" y="284" fill="#8b8b9a" font-family="Consolas,monospace" font-size="10" letter-spacing="1">EQUIPMENT: Python | TypeScript | React | Node | SQL | Git | Docker</text>
  <text x="776" y="284" text-anchor="end" fill="#7ae582" font-family="Consolas,monospace" font-size="10">STATUS: <tspan fill="#ff7a1a" font-weight="700">READY</tspan></text>

  <!-- corner accents -->
  <g stroke="#ff7a1a" stroke-width="2" fill="none">
    <path d="M4,30 L4,4 L30,4"/>
    <path d="M770,4 L796,4 L796,30"/>
    <path d="M4,270 L4,296 L30,296"/>
    <path d="M770,296 L796,296 L796,270"/>
  </g>
</svg>
