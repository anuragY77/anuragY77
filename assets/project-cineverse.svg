<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="CineVerse project — Re:Creators mode, crossover picks">
  <defs>
    <pattern id="nTone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141414" opacity=".08"/>
    </pattern>
    <filter id="nInk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    @keyframes fl { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .f { animation: fl 1.4s ease-in-out infinite; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 1.6s ease-in-out infinite; }
  </style>

  <rect width="800" height="200" fill="#f7f1e3"/>
  <rect width="800" height="200" fill="url(#nTone)"/>

  <!-- left orange energy slash -->
  <polygon points="0,0 250,0 210,200 0,200" fill="#4527a0"/>
  <g stroke="#141414" stroke-width="3" opacity=".25" stroke-linecap="round">
    <line x1="20" y1="30" x2="200" y2="50"/>
    <line x1="10" y1="90" x2="190" y2="100"/>
    <line x1="20" y1="150" x2="180" y2="155"/>
  </g>

  <!-- Re:Creators crossover portal emblem -->
  <g transform="translate(110,100)" class="pop">
    <circle r="52" fill="#f7f1e3" stroke="#141414" stroke-width="5"/>
    <rect x="-30" y="-24" width="36" height="48" rx="3" fill="#ffffff" stroke="#141414" stroke-width="3.5" transform="rotate(-8 -12 0)"/>
    <rect x="-6" y="-24" width="36" height="48" rx="3" fill="#e8e0ff" stroke="#141414" stroke-width="3.5" transform="rotate(8 12 0)"/>
    <path d="M-4,-8 L4,-8 M-4,0 L8,0 M-4,8 L2,8" stroke="#4527a0" stroke-width="2.5" stroke-linecap="round" transform="rotate(8 12 0)"/>
    <circle cx="0" cy="0" r="10" fill="#ffd166" stroke="#141414" stroke-width="2.5"/>
    <path d="M-3,0 L0,4 L5,-5" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="disp" x="110" y="178" text-anchor="middle" fill="#141414" font-size="13" letter-spacing="3">RE:CREATORS MODE</text>

  <!-- mode stamp -->
  <g transform="translate(700,36) rotate(-8)">
    <rect x="-78" y="-18" width="156" height="36" fill="#4527a0" stroke="#141414" stroke-width="3"/>
    <text class="disp" x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="14" letter-spacing="1">CROSSOVER PICKS</text>
  </g>

  <!-- title -->
  <text class="disp" x="280" y="78" fill="#141414" font-size="40" letter-spacing="2">CineVerse</text>
  <rect x="280" y="88" width="240" height="5" fill="#4527a0"/>

  <!-- description -->
  <text class="sans" x="280" y="118" fill="#141414" font-size="15" font-weight="600">Movie &amp; anime discovery — 3D, watch parties, AI picks.</text>

  <!-- speech bubble quote -->
  <g transform="translate(280,132)" filter="url(#nInk)">
    <rect width="460" height="40" rx="18" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <polygon points="20,40 8,58 48,42" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <text class="sans" x="230" y="26" text-anchor="middle" fill="#141414" font-size="14" font-style="italic" font-weight="700">"Every universe, one stage — choose your next story."</text>
  </g>

  <!-- tech tags -->
  <g class="sans" font-size="11" font-weight="700">
    <g transform="translate(280,178)"><rect width="86" height="16" fill="#141414"/><text x="43" y="12" text-anchor="middle" fill="#f7f1e3">JavaScript</text></g>
    <g transform="translate(374,178)"><rect width="60" height="16" fill="#141414"/><text x="30" y="12" text-anchor="middle" fill="#f7f1e3">React</text></g>
    <g transform="translate(442,178)"><rect width="72" height="16" fill="#141414"/><text x="36" y="12" text-anchor="middle" fill="#f7f1e3">Three.js</text></g>
    <g transform="translate(522,178)"><rect width="40" height="16" fill="#141414"/><text x="20" y="12" text-anchor="middle" fill="#f7f1e3">AI</text></g>
  </g>

  <rect x="3" y="3" width="794" height="194" fill="none" stroke="#141414" stroke-width="7"/>
</svg>
