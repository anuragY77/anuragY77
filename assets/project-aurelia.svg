<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Aurelia premium e-commerce project card">
  <defs>
    <pattern id="auTone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141414" opacity=".08"/>
    </pattern>
    <filter id="auInk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 1.6s ease-in-out infinite; }
  </style>

  <rect width="800" height="200" fill="#f7f1e3"/>
  <rect width="800" height="200" fill="url(#auTone)"/>

  <polygon points="0,0 250,0 210,200 0,200" fill="#e60012"/>
  <g stroke="#141414" stroke-width="3" opacity=".25" stroke-linecap="round">
    <line x1="20" y1="30" x2="200" y2="50"/>
    <line x1="10" y1="90" x2="190" y2="100"/>
    <line x1="20" y1="150" x2="180" y2="155"/>
  </g>

  <!-- shopping bag emblem -->
  <g transform="translate(110,100)" class="pop">
    <circle r="52" fill="#f7f1e3" stroke="#141414" stroke-width="5"/>
    <path d="M-26,-10 L-20,32 L20,32 L26,-10 Z" fill="#ffd166" stroke="#141414" stroke-width="3"/>
    <path d="M-14,-10 Q-14,-32 0,-32 Q14,-32 14,-10" fill="none" stroke="#141414" stroke-width="3"/>
    <text class="disp" x="0" y="18" text-anchor="middle" fill="#e60012" font-size="16">A</text>
  </g>
  <text class="disp" x="110" y="178" text-anchor="middle" fill="#141414" font-size="13" letter-spacing="3">BLACK CLOVER MODE</text>

  <g transform="translate(700,28) rotate(-8)">
    <rect x="-72" y="-15" width="144" height="30" fill="#e60012" stroke="#141414" stroke-width="3"/>
    <text class="disp" x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="13" letter-spacing="1">BUILT FOR SCALE</text>
  </g>

  <text class="disp" x="280" y="72" fill="#141414" font-size="40" letter-spacing="2">Aurelia</text>
  <rect x="280" y="82" width="180" height="5" fill="#e60012"/>

  <text class="sans" x="280" y="112" fill="#141414" font-size="14" font-weight="600">Myntra-grade storefront — design system, motion UI, App Router for scale.</text>

  <g transform="translate(280,126)" filter="url(#auInk)">
    <rect width="460" height="40" rx="18" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <polygon points="20,40 8,58 48,42" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <text class="sans" x="230" y="26" text-anchor="middle" fill="#141414" font-size="14" font-style="italic" font-weight="700">"Believe in the store — premium UI, never give up."</text>
  </g>

  <g class="sans" font-size="11" font-weight="700">
    <g transform="translate(280,178)"><rect width="64" height="16" fill="#141414"/><text x="32" y="12" text-anchor="middle" fill="#f7f1e3">Next.js 14</text></g>
    <g transform="translate(352,178)"><rect width="76" height="16" fill="#141414"/><text x="38" y="12" text-anchor="middle" fill="#f7f1e3">TypeScript</text></g>
    <g transform="translate(436,178)"><rect width="84" height="16" fill="#141414"/><text x="42" y="12" text-anchor="middle" fill="#f7f1e3">Tailwind CSS</text></g>
    <g transform="translate(528,178)"><rect width="72" height="16" fill="#141414"/><text x="36" y="12" text-anchor="middle" fill="#f7f1e3">Framer UI</text></g>
  </g>

  <rect x="3" y="3" width="794" height="194" fill="none" stroke="#141414" stroke-width="7"/>
</svg>
