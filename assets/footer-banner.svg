<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" role="img" aria-label="To be continued footer">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="60%" stop-color="#0e0c14"/>
      <stop offset="100%" stop-color="#1a0e06"/>
    </linearGradient>
    <linearGradient id="fTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff6e8"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="fLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e01b24" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff7a1a"/>
      <stop offset="70%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </linearGradient>
    <filter id="fG" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="fSpeed" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-22)">
      <line x1="0" y1="0" x2="0" y2="46" stroke="#ffffff" stroke-opacity="0.04" stroke-width="8"/>
      <line x1="22" y1="0" x2="22" y2="46" stroke="#ff7a1a" stroke-opacity="0.05" stroke-width="2.5"/>
    </pattern>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; font-style: italic; font-weight: 700; }
    @keyframes fArr { 0%,100% { transform: translateX(0); } 50% { transform: translateX(12px); } }
    @keyframes fP { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    .arr { animation: fArr 1.3s ease-in-out infinite; }
    .p { animation: fP 1.8s ease-in-out infinite; }
  </style>

  <rect width="800" height="150" fill="url(#fBg)"/>
  <rect width="800" height="150" fill="url(#fSpeed)"/>

  <rect x="0" y="0" width="800" height="5" fill="url(#fLine)"/>
  <rect x="-70" y="0" width="70" height="5" fill="#fff" opacity="0.55">
    <animate attributeName="x" values="-70;800" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- big dramatic slash strokes behind title -->
  <g stroke="#ffffff" stroke-width="3" opacity=".16" stroke-linecap="round">
    <line x1="60" y1="52" x2="260" y2="44"/>
    <line x1="540" y1="44" x2="740" y2="52"/>
    <line x1="90" y1="118" x2="300" y2="112"/>
    <line x1="500" y1="112" x2="710" y2="118"/>
  </g>

  <text class="sans p" x="400" y="40" text-anchor="middle" fill="#e01b24" font-size="13" letter-spacing="6">NEXT TIME — EPISODE 2026</text>

  <!-- One Piece style continued arrow -->
  <g class="arr" filter="url(#fG)">
    <g transform="translate(400,86)">
      <polygon points="-250,-26 -214,-26 -178,0 -214,26 -250,26 -214,0" fill="#ff7a1a"/>
      <rect x="-170" y="-26" width="300" height="52" fill="#050508" stroke="#ffd54f" stroke-width="3"/>
      <text class="disp" x="-20" y="14" text-anchor="middle" fill="url(#fTitle)" font-size="34" letter-spacing="4" stroke="#050508" stroke-width="6" paint-order="stroke fill">TO BE CONTINUED</text>
      <polygon points="130,-26 166,-26 202,0 166,26 130,26 166,0" fill="#ffd54f"/>
    </g>
  </g>

  <text class="sans p" x="400" y="128" text-anchor="middle" fill="#2ec4b6" font-size="13" letter-spacing="4">THANKS FOR WATCHING — SEE YOU NEXT SEASON</text>

  <rect x="0" y="145" width="800" height="5" fill="url(#fLine)"/>
</svg>
