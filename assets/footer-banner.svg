<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" role="img" aria-label="To be continued footer">
  <defs>
    <pattern id="fTone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#141414" opacity=".1"/>
    </pattern>
    <linearGradient id="fSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="55%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; font-style: italic; font-weight: 700; }
    @keyframes arr { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
    @keyframes fade { 0%,100% { opacity:1; } 50% { opacity:.55; } }
    .arr { animation: arr 1.2s ease-in-out infinite; }
    .f { animation: fade 1.8s ease-in-out infinite; }
  </style>

  <!-- warm sunset sea (One Piece end-card vibe) -->
  <rect width="800" height="150" fill="url(#fSea)"/>
  <rect width="800" height="150" fill="url(#fTone)"/>

  <!-- horizon speed lines -->
  <g stroke="#141414" stroke-width="3" opacity=".2" stroke-linecap="round">
    <line x1="40" y1="30" x2="240" y2="26"/>
    <line x1="560" y1="26" x2="760" y2="30"/>
    <line x1="60" y1="120" x2="280" y2="116"/>
    <line x1="520" y1="116" x2="740" y2="120"/>
  </g>

  <!-- next episode caption -->
  <text class="sans f" x="400" y="36" text-anchor="middle" fill="#141414" font-size="14" letter-spacing="5">NEXT TIME — EPISODE 2026</text>

  <!-- classic TO BE CONTINUED arrow board -->
  <g class="arr">
    <g transform="translate(400,84)">
      <!-- left arrow -->
      <polygon points="-268,-30 -220,-30 -172,0 -220,30 -268,30 -220,0" fill="#e60012" stroke="#141414" stroke-width="4"/>
      <!-- board -->
      <rect x="-168" y="-32" width="300" height="64" fill="#f7f1e3" stroke="#141414" stroke-width="5"/>
      <rect x="-160" y="-24" width="284" height="48" fill="none" stroke="#e60012" stroke-width="2"/>
      <text class="disp" x="-18" y="16" text-anchor="middle" fill="#141414" font-size="36" letter-spacing="2">TO BE CONTINUED</text>
      <!-- right arrow -->
      <polygon points="132,-30 180,-30 228,0 180,30 132,30 180,0" fill="#e60012" stroke="#141414" stroke-width="4"/>
    </g>
  </g>

  <text class="sans" x="400" y="136" text-anchor="middle" fill="#141414" font-size="14" letter-spacing="4">THANKS FOR WATCHING — SEE YOU NEXT SEASON</text>

  <!-- thick ink frame -->
  <rect x="2" y="2" width="796" height="146" fill="none" stroke="#141414" stroke-width="6"/>
</svg>
