<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140" role="img" aria-label="To be continued footer">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="55%" stop-color="#12101a"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="fTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff6e8"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="fLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b5c" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff7a1a"/>
      <stop offset="70%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <filter id="fG" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="fSpeed" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <line x1="0" y1="0" x2="0" y2="50" stroke="#f0f0f5" stroke-opacity="0.035" stroke-width="9"/>
      <line x1="24" y1="0" x2="24" y2="50" stroke="#ff7a1a" stroke-opacity="0.045" stroke-width="2.5"/>
    </pattern>
  </defs>
  <style>
    @keyframes fArr { 0% { transform: translateX(0); } 50% { transform: translateX(14px); } 100% { transform: translateX(0); } }
    @keyframes fP { 0%,100% { opacity:.6; } 50% { opacity:1; } }
    .arr { animation: fArr 1.4s ease-in-out infinite; transform-origin: center; }
    .p { animation: fP 2s ease-in-out infinite; }
  </style>

  <rect width="800" height="140" fill="url(#fBg)"/>
  <rect width="800" height="140" fill="url(#fSpeed)"/>

  <!-- top rule -->
  <rect x="0" y="0" width="800" height="4" fill="url(#fLine)"/>
  <rect x="-70" y="0" width="70" height="4" fill="#fff" opacity="0.5">
    <animate attributeName="x" values="-70;800" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- corner -->
  <g stroke="#ffd166" stroke-width="2" fill="none" opacity="0.85" filter="url(#fG)">
    <path d="M14,40 L14,14 L46,14"/>
    <path d="M754,14 L786,14 L786,40"/>
    <path d="M14,100 L14,126 L46,126"/>
    <path d="M754,126 L786,126 L786,100"/>
  </g>

  <!-- center block -->
  <text class="p" x="400" y="42" text-anchor="middle" fill="#ff3b5c" font-family="Consolas,monospace" font-size="11" letter-spacing="5" filter="url(#fG)">END OF TRANSMISSION</text>

  <g class="arr">
    <text x="400" y="84" text-anchor="middle" fill="#0a0a0f" stroke="#0a0a0f" stroke-width="10" stroke-linejoin="round" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="3">TO BE CONTINUED</text>
    <text x="400" y="84" text-anchor="middle" fill="url(#fTitle)" stroke="#ffd166" stroke-width="1" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="3" filter="url(#fG)">TO BE CONTINUED &#10132;</text>
  </g>

  <text class="p" x="400" y="110" text-anchor="middle" fill="#2ec4b6" font-family="'Yu Gothic','Segoe UI',sans-serif" font-size="12" letter-spacing="4">つづく &#183; THANKS FOR WATCHING &#183; 次回もお楽しみに</text>
  <text x="400" y="128" text-anchor="middle" fill="#8b8b9a" font-family="Consolas,monospace" font-size="10" letter-spacing="2">SEASON 2026 // EP.2026 FINALE // STAY TUNED</text>

  <!-- bottom rule -->
  <rect x="0" y="136" width="800" height="4" fill="url(#fLine)"/>
</svg>
