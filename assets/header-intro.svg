<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 70" width="800" height="70" role="img" aria-label="Episode 01 header: system intro">
  <defs>
    <linearGradient id="h1bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="60%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="h1line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="70%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h1beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff6e8"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <filter id="h1g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    </defs>
  <style>
    @keyframes h1cur { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes h1p { 0%,100% { opacity:.5; } 50% { opacity:1; } }
    .cur { animation: h1cur 1s step-end infinite; }
    .p { animation: h1p 2s ease-in-out infinite; }
  </style>

  <rect width="800" height="70" fill="url(#h1bg)"/>
  <rect x="0" y="0" width="6" height="70" fill="#ff7a1a"/>

  <!-- EP badge -->
  <g filter="url(#h1g)">
    <rect x="24" y="14" width="86" height="42" rx="3" fill="#ff7a1a"/>
    <text x="67" y="34" text-anchor="middle" fill="#0a0a0f" font-family="Consolas,monospace" font-size="10" font-weight="700" letter-spacing="2">EPISODE</text>
    <text x="67" y="50" text-anchor="middle" fill="#fff6e8" font-family="Consolas,monospace" font-size="16" font-weight="800">01</text>
  </g>

  <!-- title block -->
  <g>
    <text x="128" y="32" fill="#ffd166" font-family="Consolas,monospace" font-size="11" letter-spacing="3">MISSION_FILE // 忍者登録</text>
    <text x="126" y="56" fill="#f0f0f5" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="24" font-weight="900" letter-spacing="2">SYSTEM_INTRO</text>
    <text x="380" y="56" fill="#ff7a1a" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="24" font-weight="900" class="cur">_</text>
  </g>

  <!-- speed ticks -->
  <g stroke="#ff7a1a" stroke-width="2" opacity="0.6">
    <line x1="580" y1="18" x2="760" y2="18"/>
    <line x1="640" y1="36" x2="760" y2="36"/>
    <line x1="700" y1="54" x2="760" y2="54"/>
  </g>
  <circle cx="770" cy="18" r="3" fill="#ff7a1a" class="p"/>

  <rect x="0" y="66" width="800" height="4" fill="url(#h1line)"/>
  <rect x="-80" y="66" width="80" height="4" fill="url(#h1beam)">
    <animate attributeName="x" values="-80;800" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
