<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 72" width="800" height="72" role="img" aria-label="Episode title card: About">
  <defs>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    @keyframes sl { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    @keyframes fl { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    .a { animation: sl 2s ease-in-out infinite; }
    .f { animation: fl 1.4s ease-in-out infinite; }
  </style>
  <rect width="800" height="72" fill="#0a0a10"/>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="2" opacity=".15">
    <line x1="500" y1="10" x2="780" y2="30"/>
    <line x1="520" y1="36" x2="780" y2="50"/>
    <line x1="540" y1="60" x2="780" y2="66"/>
  </g>
  <!-- ep badge -->
  <g transform="translate(28,14) skewX(-10)">
    <rect width="72" height="44" fill="url(#t1)"/>
    <text class="disp" x="36" y="20" text-anchor="middle" fill="#0a0a10" font-size="11" letter-spacing="2">EPISODE</text>
    <text class="disp" x="36" y="40" text-anchor="middle" fill="#ffffff" font-size="22">01</text>
  </g>
  <text class="sans" x="122" y="30" fill="#e01b24" font-size="13" font-weight="700" letter-spacing="4" font-style="italic">ORIGIN STORY — DEMON SWORD AWAKENS</text>
  <text class="disp" x="120" y="60" fill="#ffffff" font-size="30" letter-spacing="4">ABOUT ME</text>
  <rect x="120" y="64" width="220" height="4" fill="url(#t1)" class="a"/>
  <circle cx="770" cy="36" r="5" fill="#e01b24" class="f"/>
</svg>
