<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 64" width="800" height="64" role="img" aria-label="Section header: System Intro">
  <defs>
    <linearGradient id="h1Line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h1Text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56d4dd"/>
      <stop offset="70%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="h1Beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="h1Glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="h1Type">
      <rect x="70" y="14" width="0" height="40">
        <animate attributeName="width" from="0" to="290" dur="1.8s" fill="freeze" repeatCount="1"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    @keyframes hBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes hDot { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .hCur { animation: hBlink 0.9s step-end infinite; }
    .hDot { animation: hDot 1.4s ease-in-out infinite; }
  </style>

  <rect width="800" height="64" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="63" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>

  <g stroke="#22d3ee" stroke-width="1.6" fill="none" opacity="0.9" filter="url(#h1Glow)">
    <path d="M10,16 L10,6 L26,6"/>
    <path d="M10,48 L10,58 L26,58"/>
    <path d="M774,6 L790,6 L790,16"/>
    <path d="M790,48 L790,58 L774,58"/>
  </g>

  <text class="hDot" x="40" y="40" fill="#3fb950" font-family="Consolas,monospace" font-size="16" filter="url(#h1Glow)">&#9679;</text>

  <g clip-path="url(#h1Type)">
    <text x="70" y="41" fill="url(#h1Text)" font-family="Consolas, 'Cascadia Code', monospace" font-size="26" font-weight="700" letter-spacing="3" filter="url(#h1Glow)">// SYSTEM_INTRO</text>
  </g>
  <text class="hCur" x="368" y="41" fill="#56d4dd" font-family="Consolas, monospace" font-size="26" font-weight="700">_</text>

  <text x="755" y="38" text-anchor="end" fill="#c084fc" font-family="Consolas, monospace" font-size="11" opacity="0.75" letter-spacing="1">0x01</text>

  <rect x="10" y="61" width="780" height="3" fill="url(#h1Line)" opacity="0.9"/>
  <rect x="10" y="61" width="70" height="3" fill="url(#h1Beam)">
    <animate attributeName="x" values="10;720;10" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
