<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 92" width="800" height="92" role="img" aria-label="Next episode preview - Latest Feeds title card">
  <defs>
    <pattern id="hfTone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141414" opacity=".07"/>
    </pattern>
    <pattern id="hfSprocket" width="18" height="14" patternUnits="userSpaceOnUse">
      <rect x="4" y="3" width="8" height="8" rx="1.5" fill="#f7f1e3" stroke="#141414" stroke-width="1.5"/>
    </pattern>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; font-style: italic; font-weight: 700; }
    @keyframes stamp { 0% { transform: scale(1.7) rotate(-20deg); opacity:0; } 55% { transform: scale(.94) rotate(-9deg); opacity:1; } 100% { transform: scale(1) rotate(-9deg); opacity:1; } }
    @keyframes under { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes reel { from { transform: translateY(0); } to { transform: translateY(-14px); } }
    @keyframes blinkDot { 0%,45% { opacity:1; } 50%,100% { opacity:.15; } }
    .stamp { transform-box: fill-box; transform-origin: center; animation: stamp .55s ease-out both; }
    .under { transform-origin: left center; animation: under .65s .15s ease-out both; }
    .reel { animation: reel 1.1s linear infinite; }
    .bd { animation: blinkDot .9s step-end infinite; }
  </style>

  <rect width="800" height="92" fill="#f7f1e3"/>
  <rect width="800" height="92" fill="url(#hfTone)"/>

  <!-- diagonal red energy band -->
  <polygon points="0,92 0,58 140,92" fill="#e60012" opacity=".12"/>
  <polygon points="800,0 800,30 660,0" fill="#e60012" opacity=".1"/>

  <!-- film strip right -->
  <g transform="translate(560,10)">
    <rect x="0" y="0" width="220" height="72" fill="#141414"/>
    <rect x="0" y="0" width="220" height="12" fill="url(#hfSprocket)"/>
    <rect x="0" y="60" width="220" height="12" fill="url(#hfSprocket)"/>
    <!-- frames -->
    <rect x="12" y="16" width="58" height="40" fill="#f7f1e3" stroke="#e60012" stroke-width="2"/>
    <rect x="80" y="16" width="58" height="40" fill="#f7f1e3" stroke="#f0b429" stroke-width="2"/>
    <rect x="148" y="16" width="58" height="40" fill="#f7f1e3" stroke="#0d9488" stroke-width="2"/>
    <!-- frame marks -->
    <g class="reel">
      <rect x="20" y="24" width="42" height="4" fill="#e60012"/>
      <rect x="20" y="34" width="28" height="4" fill="#141414" opacity=".35"/>
      <rect x="88" y="24" width="42" height="4" fill="#f0b429"/>
      <rect x="88" y="34" width="34" height="4" fill="#141414" opacity=".35"/>
      <rect x="156" y="24" width="42" height="4" fill="#0d9488"/>
      <rect x="156" y="34" width="22" height="4" fill="#141414" opacity=".35"/>
    </g>
    <!-- REC dots -->
    <circle cx="20" cy="6" r="3" fill="#e60012" class="bd"/>
    <text class="disp" x="30" y="9" fill="#f7f1e3" font-size="8" letter-spacing="1">REC</text>
    <text class="disp" x="175" y="9" fill="#f0b429" font-size="8" letter-spacing="1">05</text>
  </g>

  <!-- EP stamp -->
  <g transform="translate(50,46)"><g class="stamp">
    <circle r="30" fill="none" stroke="#141414" stroke-width="6" opacity=".15"/>
    <circle r="30" fill="none" stroke="#e60012" stroke-width="4"/>
    <circle r="23" fill="#e60012"/>
    <circle r="23" fill="none" stroke="#141414" stroke-width="2"/>
    <text class="disp" x="0" y="-5" text-anchor="middle" fill="#f7f1e3" font-size="9" letter-spacing="1.5">NEXT</text>
    <text class="disp" x="0" y="15" text-anchor="middle" fill="#ffffff" font-size="20">EP</text>
  </g></g>

  <text class="sans" x="94" y="32" fill="#e60012" font-size="13" letter-spacing="2.5">Preview — what happens next</text>
  <text class="disp" x="92" y="68" fill="#141414" font-size="38" letter-spacing="4">LATEST FEEDS</text>
  <rect class="under" x="92" y="76" width="300" height="6" fill="#e60012"/>
  <rect class="under" x="92" y="84" width="160" height="3" fill="#f0b429" opacity=".85"/>

  <!-- registration corners -->
  <g stroke="#141414" stroke-width="3" fill="none" opacity=".55">
    <path d="M10 22 V10 H22"/>
    <path d="M790 70 V82 H778"/>
  </g>

  <rect x="2" y="2" width="796" height="88" fill="none" stroke="#141414" stroke-width="5"/>
</svg>
