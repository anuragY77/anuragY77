<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Engineering profile for Anurag Yadav — 97 commits last year, streak 4">
  <defs>
    <pattern id="psTone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#141414" opacity=".055"/>
    </pattern>
    <pattern id="psHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#e60012" stroke-width="1.2" opacity=".12"/>
    </pattern>
    <clipPath id="langClip">
      <rect x="530" y="148" width="246" height="14" rx="7"/>
    </clipPath>
    <clipPath id="psClip"><rect width="800" height="420"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#141414" flood-opacity=".12"/>
    </filter>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "Consolas", "Courier New", monospace; }
    @keyframes psPulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
    .pulse { animation: psPulse 2.2s ease-in-out infinite; }
  </style>

  <g clip-path="url(#psClip)">
    <rect width="800" height="420" fill="#f7f1e3"/>
    <rect width="800" height="420" fill="url(#psTone)"/>

    <!-- left red rail -->
    <rect x="0" y="0" width="10" height="420" fill="#e60012"/>
    <rect x="10" y="0" width="3" height="420" fill="#141414"/>

    <!-- ghost number -->
    <text class="disp" x="195" y="310" text-anchor="middle" fill="#141414" fill-opacity=".045" font-size="200" letter-spacing="-6">97</text>

    <!-- corner registration marks -->
    <g stroke="#141414" stroke-width="1.5" opacity=".35">
      <path d="M28,28 h14 M28,28 v14"/>
      <path d="M772,28 h-14 M772,28 v14"/>
      <path d="M28,392 h14 M28,392 v-14"/>
      <path d="M772,392 h-14 M772,392 v-14"/>
    </g>

    <!-- hatch accent behind languages -->
    <rect x="518" y="100" width="270" height="210" fill="url(#psHatch)" rx="8"/>

    <!-- header -->
    <g>
      <rect x="40" y="36" width="8" height="36" fill="#e60012"/>
      <text class="disp" x="62" y="54" fill="#141414" font-size="26" letter-spacing="2">ENGINEERING PROFILE</text>
      <text class="sans" x="64" y="74" fill="#141414" fill-opacity=".55" font-size="12" font-weight="600" letter-spacing=".5">Anurag Yadav — github.com/anuragY77</text>

      <!-- LIVE pill -->
      <g transform="translate(632,44)">
        <rect x="0" y="0" width="136" height="28" rx="14" fill="#141414"/>
        <circle cx="18" cy="14" r="5" fill="#e60012" class="pulse"/>
        <text class="sans" x="32" y="18" fill="#f7f1e3" font-size="11" font-weight="700" letter-spacing="1">LIVE · UPDATED</text>
      </g>
    </g>

    <line x1="40" y1="92" x2="760" y2="92" stroke="#141414" stroke-width="3"/>

    <!-- HERO stat -->
    <g transform="translate(48,140)">
      <text class="mono" x="0" y="14" fill="#e60012" font-size="11" font-weight="700" letter-spacing="3">01 — VELOCITY</text>
      <text class="disp" x="0" y="92" fill="#141414" font-size="96" letter-spacing="-2">97</text>
      <text class="sans" x="4" y="118" fill="#141414" font-size="14" font-weight="700" letter-spacing="2">COMMITS · LAST 12 MONTHS</text>
      <rect x="4" y="130" width="120" height="4" fill="#e60012"/>
    </g>

    <!-- secondary metrics -->
    <g transform="translate(40,130)">
      <text class="mono" x="210" y="14" fill="#e60012" font-size="11" font-weight="700" letter-spacing="3">02 — LEDGER</text>
    </g>
    
  <g transform="translate(250,168)">
    <line x1="0" y1="-14" x2="230" y2="-14" stroke="#141414" stroke-opacity=".12" stroke-width="1"/>
    <text class="sans" x="0" y="6" fill="#141414" fill-opacity=".35" font-size="13" font-weight="600">Stars earned</text>
    <text class="disp" x="230" y="8" text-anchor="end" fill="#141414" fill-opacity=".28" font-size="20">0</text>
  </g>
  <g transform="translate(250,204)">
    <line x1="0" y1="-14" x2="230" y2="-14" stroke="#141414" stroke-opacity=".12" stroke-width="1"/>
    <text class="sans" x="0" y="6" fill="#141414" fill-opacity=".35" font-size="13" font-weight="600">Pull requests</text>
    <text class="disp" x="230" y="8" text-anchor="end" fill="#141414" fill-opacity=".28" font-size="20">0</text>
  </g>
  <g transform="translate(250,240)">
    <line x1="0" y1="-14" x2="230" y2="-14" stroke="#141414" stroke-opacity=".12" stroke-width="1"/>
    <text class="sans" x="0" y="6" fill="#141414" fill-opacity=".35" font-size="13" font-weight="600">Issues closed</text>
    <text class="disp" x="230" y="8" text-anchor="end" fill="#141414" fill-opacity=".28" font-size="20">0</text>
  </g>
  <g transform="translate(250,276)">
    <line x1="0" y1="-14" x2="230" y2="-14" stroke="#141414" stroke-opacity=".12" stroke-width="1"/>
    <text class="sans" x="0" y="6" fill="#141414" fill-opacity=".75" font-size="13" font-weight="600">Public repositories</text>
    <text class="disp" x="230" y="8" text-anchor="end" fill="#e60012" fill-opacity="1" font-size="20">7</text>
  </g>
  <g transform="translate(250,312)">
    <line x1="0" y1="-14" x2="230" y2="-14" stroke="#141414" stroke-opacity=".12" stroke-width="1"/>
    <text class="sans" x="0" y="6" fill="#141414" fill-opacity=".35" font-size="13" font-weight="600">Followers</text>
    <text class="disp" x="230" y="8" text-anchor="end" fill="#141414" fill-opacity=".28" font-size="20">0</text>
  </g>

    <!-- languages -->
    <g filter="url(#soft)">
      <rect x="514" y="88" width="278" height="230" rx="8" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
    </g>
    <text class="mono" x="530" y="114" fill="#e60012" font-size="11" font-weight="700" letter-spacing="3">03 — STACK</text>
    <text class="disp" x="530" y="134" fill="#141414" font-size="16" letter-spacing="1.5">TOP LANGUAGES</text>
    <rect x="530" y="148" width="246" height="14" rx="7" fill="#ddd2b8"/>
    <g clip-path="url(#langClip)"><rect x="530.0" y="148" width="162.8" height="14" fill="#3178c6"/><rect x="692.8" y="148" width="76.8" height="14" fill="#f1e05a"/><rect x="769.7" y="148" width="4.3" height="14" fill="#3572A5"/><rect x="774.0" y="148" width="2.0" height="14" fill="#663399"/><rect x="775.7" y="148" width="2.0" height="14" fill="#e34c26"/></g>
    <rect x="530" y="148" width="246" height="14" rx="7" fill="none" stroke="#141414" stroke-width="2"/>
    
  <g transform="translate(530,188)">
    <circle cx="5" cy="-4" r="5" fill="#3178c6" stroke="#141414" stroke-width="1.5"/>
    <text class="sans" x="16" y="0" fill="#141414" font-size="12" font-weight="700">TypeScript</text>
    <text class="disp" x="16" y="16" fill="#e60012" font-size="13">66.2%</text>
  </g>
  <g transform="translate(654,188)">
    <circle cx="5" cy="-4" r="5" fill="#f1e05a" stroke="#141414" stroke-width="1.5"/>
    <text class="sans" x="16" y="0" fill="#141414" font-size="12" font-weight="700">JavaScript</text>
    <text class="disp" x="16" y="16" fill="#e60012" font-size="13">31.2%</text>
  </g>
  <g transform="translate(530,222)">
    <circle cx="5" cy="-4" r="5" fill="#3572A5" stroke="#141414" stroke-width="1.5"/>
    <text class="sans" x="16" y="0" fill="#141414" font-size="12" font-weight="700">Python</text>
    <text class="disp" x="16" y="16" fill="#e60012" font-size="13">1.7%</text>
  </g>
  <g transform="translate(654,222)">
    <circle cx="5" cy="-4" r="5" fill="#663399" stroke="#141414" stroke-width="1.5"/>
    <text class="sans" x="16" y="0" fill="#141414" font-size="12" font-weight="700">CSS</text>
    <text class="disp" x="16" y="16" fill="#e60012" font-size="13">0.7%</text>
  </g>
  <g transform="translate(530,256)">
    <circle cx="5" cy="-4" r="5" fill="#e34c26" stroke="#141414" stroke-width="1.5"/>
    <text class="sans" x="16" y="0" fill="#141414" font-size="12" font-weight="700">HTML</text>
    <text class="disp" x="16" y="16" fill="#e60012" font-size="13">0.1%</text>
  </g>

    <!-- footer streak band -->
    <g>
      <rect x="40" y="324" width="720" height="68" rx="6" fill="#141414"/>
      <rect x="40" y="324" width="6" height="68" fill="#e60012"/>
      <!-- diagonal cut accent -->
      <polygon points="670,324 760,324 760,392 720,392" fill="#e60012" opacity=".9"/>
      <polygon points="690,324 710,324 750,392 730,392" fill="#ff6a00" opacity=".85"/>
    </g>

    <g transform="translate(64,368)">
      <text class="disp" x="0" y="4" fill="#ffd166" font-size="26">105</text>
      <text class="sans" x="0" y="22" fill="#f7f1e3" fill-opacity=".8" font-size="9" font-weight="700" letter-spacing="1.4">TOTAL CONTRIBUTIONS</text>
    </g>

    <g transform="translate(270,368)">
      <circle cx="10" cy="-4" r="14" fill="none" stroke="#ff6a00" stroke-width="3" stroke-dasharray="32 70" transform="rotate(-90 10 -4)"/>
      <path class="pulse" d="M10,-14 C13,-9 16,-6 16,-1 C16,5 13,10 10,10 C7,10 4,5 4,-1 C4,-6 7,-9 10,-14 Z" fill="#e60012"/>
      <text class="disp" x="34" y="4" fill="#ffd166" font-size="26">4</text>
      <text class="sans" x="34" y="22" fill="#f7f1e3" fill-opacity=".8" font-size="9" font-weight="700" letter-spacing="1.4">CURRENT STREAK</text>
    </g>

    <g transform="translate(480,368)">
      <text class="disp" x="0" y="4" fill="#ffd166" font-size="26">4</text>
      <text class="sans" x="0" y="22" fill="#f7f1e3" fill-opacity=".8" font-size="9" font-weight="700" letter-spacing="1.4">LONGEST STREAK</text>
    </g>

    <!-- thin dividers in footer -->
    <line x1="250" y1="342" x2="250" y2="380" stroke="#f7f1e3" stroke-opacity=".2" stroke-width="1"/>
    <line x1="460" y1="342" x2="460" y2="380" stroke="#f7f1e3" stroke-opacity=".2" stroke-width="1"/>
  </g>

  <rect x="4" y="4" width="792" height="412" fill="none" stroke="#141414" stroke-width="8"/>
</svg>
