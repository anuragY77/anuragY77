    @keyframes psSlash { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    .pulse { animation: psPulse 2s ease-in-out infinite; }
    .slash { stroke-dasharray: 400; animation: psSlash 1.4s ease-out both; }
  </style>

