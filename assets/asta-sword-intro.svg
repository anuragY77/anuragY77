<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="Asta demon sword slash manga panel with speech bubble">
  <defs>
    <linearGradient id="bladeMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a38"/>
      <stop offset="35%" stop-color="#6a6a88"/>
      <stop offset="50%" stop-color="#f0f0ff"/>
      <stop offset="65%" stop-color="#6a6a88"/>
      <stop offset="100%" stop-color="#2a2a38"/>
    </linearGradient>
    <linearGradient id="antiTrail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0530" stop-opacity="0"/>
      <stop offset="40%" stop-color="#7c4dff"/>
      <stop offset="70%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#1a0530" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="slashBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0c8ff"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="aTone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.8" cy="1.8" r="1" fill="#141414" opacity=".12"/>
    </pattern>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.9"/>
    </filter>
    <clipPath id="panelClip"><rect x="8" y="8" width="784" height="254"/></clipPath>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    @keyframes aura { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @keyframes spark { 0%,100% { opacity:.3; transform: translateY(0); } 50% { opacity:1; transform: translateY(-8px); } }
    .au { animation: aura 2s ease-in-out infinite; }
    .sp { animation: spark 1.4s ease-in-out infinite; }
  </style>

  <!-- manga paper page -->
  <rect width="800" height="270" fill="#f7f1e3"/>

  <!-- scene panel (dark anime bg inside ink frame) -->
  <rect x="8" y="8" width="784" height="254" fill="#12101c"/>

  <g clip-path="url(#panelClip)">
    <!-- diagonal split -->
    <polygon points="0,0 350,0 290,270 0,270" fill="#0d0d18" opacity=".65"/>
    <polygon points="0,0 350,0 290,270 0,270" fill="url(#aTone)"/>

    <!-- speed lines -->
    <g stroke="#ffffff" stroke-width="2" opacity=".14">
      <line x1="0" y1="20" x2="310" y2="80"/>
      <line x1="0" y1="60" x2="310" y2="120"/>
      <line x1="0" y1="100" x2="310" y2="160"/>
      <line x1="0" y1="140" x2="310" y2="200"/>
      <line x1="0" y1="180" x2="310" y2="240"/>
      <line x1="0" y1="220" x2="300" y2="260"/>
    </g>

    <!-- ASTA sword action -->
    <g transform="translate(155,145)">
      <g class="au" filter="url(#gl)">
        <path d="M-90,60 Q-100,-20 -60,-50 Q-40,-90 0,-100 Q40,-90 60,-50 Q100,-20 90,60 Q70,100 0,110 Q-70,100 -90,60 Z" fill="#1a0530" opacity=".7"/>
        <ellipse cx="0" cy="10" rx="70" ry="85" fill="#7c4dff" opacity=".18"/>
      </g>
      <g fill="#b388ff" class="sp">
        <circle cx="-70" cy="-20" r="3"/>
        <circle cx="75" cy="-40" r="2.5"/>
        <circle cx="-55" cy="55" r="2.5"/>
        <circle cx="70" cy="50" r="3"/>
        <circle cx="0" cy="-110" r="3.5"/>
        <circle cx="-40" cy="-80" r="2"/>
        <circle cx="50" cy="-75" r="2"/>
      </g>

      <g transform="rotate(-40)">
        <path d="M-80,-60 Q0,-110 80,-40" fill="none" stroke="url(#antiTrail)" stroke-width="18" stroke-linecap="round" opacity=".65"/>
        <path d="M-70,-55 Q0,-100 70,-40" fill="none" stroke="#e8e8ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        <path d="M-7,-95 L7,-95 L12,45 L0,62 L-12,45 Z" fill="url(#bladeMetal)" stroke="#000" stroke-width="2"/>
        <path d="M-7,-95 L0,-95 L3,45 L0,62 L-5,45 Z" fill="#b388ff" opacity=".55" class="au"/>
        <g stroke="#e01b24" stroke-width="2" fill="none" filter="url(#gl)">
          <path d="M-4,-55 L4,-48 L-4,-41"/>
          <path d="M-4,-30 L4,-23 L-4,-16"/>
          <path d="M-4,-5 L4,2 L-4,9"/>
          <path d="M-3,22 L3,29 L-3,36"/>
        </g>
        <rect x="-26" y="62" width="52" height="10" rx="2" fill="#2a2a40" stroke="#b388ff" stroke-width="2"/>
        <rect x="-6" y="72" width="12" height="34" rx="2" fill="#12121e" stroke="#e01b24" stroke-width="1.5"/>
        <circle cx="0" cy="112" r="8" fill="#7c4dff" stroke="#000" stroke-width="2" class="au"/>
      </g>

      <!-- impact starburst -->
      <g transform="translate(95,-75)" filter="url(#gl)">
        <polygon points="0,-45 10,-12 42,-28 18,0 48,18 12,14 8,48 -6,18 -38,32 -16,4 -48,-8 -14,-16 -30,-48 -4,-22" fill="url(#slashBurst)"/>
        <polygon points="0,-28 6,-8 26,-16 12,0 30,12 8,8 4,30 -4,10 -24,18 -10,4 -30,-4 -8,-10 -18,-30 -2,-14" fill="#ffffff" opacity=".9"/>
      </g>

      <text class="disp" x="100" y="-90" fill="#ffffff" stroke="#000" stroke-width="5" font-size="34" font-style="italic" transform="rotate(-15 100 -90)" style="paint-order:stroke fill" filter="url(#ink)">SLASH!</text>
      <text class="disp" x="-130" y="80" fill="#b388ff" stroke="#000" stroke-width="4" font-size="20" font-style="italic" transform="rotate(8 -130 80)" style="paint-order:stroke fill">WHOOSH</text>
    </g>

    <!-- ===== RIGHT: pure manga (paper + ink) ===== -->
    <rect x="360" y="0" width="440" height="270" fill="#f7f1e3"/>
    <rect x="360" y="0" width="440" height="270" fill="url(#aTone)"/>

    <!-- narration box -->
    <g transform="translate(390,24)">
      <rect width="380" height="54" fill="#ffffff" stroke="#141414" stroke-width="4"/>
      <text class="disp" x="190" y="28" text-anchor="middle" fill="#141414" font-size="20" letter-spacing="6">WHO AM I</text>
      <text class="sans" x="190" y="46" text-anchor="middle" fill="#e60012" font-size="12" font-style="italic" letter-spacing="2">The demon sword awakened</text>
    </g>

    <!-- speech bubble -->
    <g transform="translate(390,96)" filter="url(#ink)">
      <ellipse cx="190" cy="58" rx="188" ry="58" fill="#ffffff" stroke="#141414" stroke-width="4"/>
      <polygon points="50,100 14,148 95,105" fill="#ffffff" stroke="#141414" stroke-width="4"/>
      <polygon points="58,96 28,138 90,102" fill="#ffffff"/>
      <text class="sans" x="190" y="44" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">I build things that refuse</text>
      <text class="sans" x="190" y="66" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">to stay ordinary —</text>
      <text class="sans" x="190" y="90" text-anchor="middle" fill="#7c4dff" font-size="15" font-style="italic" font-weight="700">sharp, loud, unbreakable.</text>
    </g>

    <!-- yellow anime narration strip -->
    <g transform="translate(390,210)">
      <rect width="380" height="44" fill="#ffd166" stroke="#141414" stroke-width="4"/>
      <text class="disp" x="190" y="20" text-anchor="middle" fill="#141414" font-size="13" letter-spacing="2">FULL-STACK APPS · AI TOOLS · DATA PIPELINES</text>
      <text class="sans" x="190" y="37" text-anchor="middle" fill="#141414" font-size="12" font-style="italic">Current arc: shipping · open source · never give up</text>
    </g>

    <!-- gutter between panels -->
    <rect x="352" y="0" width="8" height="270" fill="#141414"/>
  </g>

  <!-- thick manga ink border -->
  <rect x="6" y="6" width="788" height="258" fill="none" stroke="#141414" stroke-width="8"/>
</svg>
