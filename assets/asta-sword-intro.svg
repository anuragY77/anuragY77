<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Asta demon sword slash action scene with speech bubble">
  <defs>
    <linearGradient id="panBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#14081f"/>
    </linearGradient>
    <linearGradient id="bladeMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="35%" stop-color="#4a4a68"/>
      <stop offset="50%" stop-color="#e8e8ff"/>
      <stop offset="65%" stop-color="#4a4a68"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="antiTrail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0530" stop-opacity="0"/>
      <stop offset="40%" stop-color="#7c4dff"/>
      <stop offset="70%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#1a0530" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="slashBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0c8ff"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <clipPath id="panelClip"><rect x="8" y="8" width="784" height="244" rx="4"/></clipPath>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    .mono { font-family: Consolas, monospace; }
    @keyframes aura { 0%,100% { opacity:.5; } 50% { opacity:1; } }
    @keyframes spark { 0%,100% { opacity:.3; transform: translateY(0); } 50% { opacity:1; transform: translateY(-8px); } }
    .au { animation: aura 2s ease-in-out infinite; }
    .sp { animation: spark 1.4s ease-in-out infinite; }
  </style>

  <!-- manga panel background -->
  <rect width="800" height="260" fill="#f0ebe0"/>
  <rect x="8" y="8" width="784" height="244" fill="url(#panBg)"/>

  <g clip-path="url(#panelClip)">
    <!-- diagonal panel split line (manga style) -->
    <polygon points="0,0 340,0 280,260 0,260" fill="#0d0d18" opacity=".6"/>

    <!-- speed lines background -->
    <g stroke="#ffffff" stroke-width="2" opacity=".12">
      <line x1="0" y1="20" x2="300" y2="80"/>
      <line x1="0" y1="60" x2="300" y2="120"/>
      <line x1="0" y1="100" x2="300" y2="160"/>
      <line x1="0" y1="140" x2="300" y2="200"/>
      <line x1="0" y1="180" x2="300" y2="240"/>
      <line x1="0" y1="220" x2="300" y2="255"/>
    </g>

    <!-- ===== LEFT: ASTA DEMON SLASH ACTION ===== -->
    <g transform="translate(150,140)">
      <!-- anti-magic aura eruption -->
      <g class="au" filter="url(#gl)">
        <path d="M-90,60 Q-100,-20 -60,-50 Q-40,-90 0,-100 Q40,-90 60,-50 Q100,-20 90,60 Q70,100 0,110 Q-70,100 -90,60 Z" fill="#1a0530" opacity=".7"/>
        <ellipse cx="0" cy="10" rx="70" ry="85" fill="#7c4dff" opacity=".18"/>
      </g>
      <!-- dark energy sparks -->
      <g fill="#b388ff" class="sp">
        <circle cx="-70" cy="-20" r="3"/>
        <circle cx="75" cy="-40" r="2.5"/>
        <circle cx="-55" cy="55" r="2.5"/>
        <circle cx="70" cy="50" r="3"/>
        <circle cx="0" cy="-110" r="3.5"/>
        <circle cx="-40" cy="-80" r="2"/>
        <circle cx="50" cy="-75" r="2"/>
      </g>

      <!-- sword mid-swing (diagonal slash pose) -->
      <g transform="rotate(-40)">
        <!-- motion arc following blade -->
        <path d="M-80,-60 Q0,-110 80,-40" fill="none" stroke="url(#antiTrail)" stroke-width="18" stroke-linecap="round" opacity=".65"/>
        <path d="M-70,-55 Q0,-100 70,-40" fill="none" stroke="#e8e8ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>

        <!-- blade -->
        <path d="M-7,-95 L7,-95 L12,45 L0,62 L-12,45 Z" fill="url(#bladeMetal)" stroke="#000" stroke-width="2"/>
        <!-- demon edge glow -->
        <path d="M-7,-95 L0,-95 L3,45 L0,62 L-5,45 Z" fill="#b388ff" opacity=".55" class="au"/>
        <!-- runes -->
        <g stroke="#e01b24" stroke-width="2" fill="none" filter="url(#gl)">
          <path d="M-4,-55 L4,-48 L-4,-41"/>
          <path d="M-4,-30 L4,-23 L-4,-16"/>
          <path d="M-4,-5 L4,2 L-4,9"/>
          <path d="M-3,22 L3,29 L-3,36"/>
        </g>
        <!-- guard + handle -->
        <rect x="-26" y="62" width="52" height="10" rx="2" fill="#2a2a40" stroke="#b388ff" stroke-width="2"/>
        <rect x="-6" y="72" width="12" height="34" rx="2" fill="#12121e" stroke="#e01b24" stroke-width="1.5"/>
        <circle cx="0" cy="112" r="8" fill="#7c4dff" stroke="#000" stroke-width="2" class="au"/>
      </g>

      <!-- impact burst where slash lands -->
      <g transform="translate(95,-75)" filter="url(#gl)">
        <polygon points="0,-45 10,-12 42,-28 18,0 48,18 12,14 8,48 -6,18 -38,32 -16,4 -48,-8 -14,-16 -30,-48 -4,-22" fill="url(#slashBurst)"/>
        <polygon points="0,-28 6,-8 26,-16 12,0 30,12 8,8 4,30 -4,10 -24,18 -10,4 -30,-4 -8,-10 -18,-30 -2,-14" fill="#ffffff" opacity=".9"/>
      </g>

      <!-- sound effect text -->
      <text class="disp" x="100" y="-90" fill="#ffffff" stroke="#000" stroke-width="5" font-size="32" font-style="italic" transform="rotate(-15 100 -90)" style="paint-order:stroke fill" filter="url(#ink)">SLASH!</text>
      <text class="disp" x="-130" y="80" fill="#b388ff" stroke="#000" stroke-width="4" font-size="20" font-style="italic" transform="rotate(8 -130 80)" style="paint-order:stroke fill">WHOOSH</text>
    </g>

    <!-- ===== RIGHT: narration + speech bubble ===== -->
    <!-- narration box (manga caption) -->
    <g transform="translate(400,30)">
      <rect width="370" height="52" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <rect x="6" y="6" width="358" height="40" fill="none" stroke="#000" stroke-width="1"/>
      <text class="disp" x="185" y="28" text-anchor="middle" fill="#000" font-size="18" letter-spacing="6">WHO AM I</text>
      <text class="mono" x="185" y="43" text-anchor="middle" fill="#444" font-size="10" letter-spacing="2">DEMON SWORD AWAKENED</text>
    </g>

    <!-- speech bubble -->
    <g transform="translate(400,100)" filter="url(#ink)">
      <ellipse cx="175" cy="55" rx="175" ry="55" fill="#ffffff" stroke="#000" stroke-width="3.5"/>
      <!-- bubble tail -->
      <polygon points="40,95 10,135 85,100" fill="#ffffff" stroke="#000" stroke-width="3.5"/>
      <polygon points="48,92 22,125 80,98" fill="#ffffff"/>
      <text class="sans" x="175" y="42" text-anchor="middle" fill="#111" font-size="15" font-weight="700">I build things that refuse</text>
      <text class="sans" x="175" y="62" text-anchor="middle" fill="#111" font-size="15" font-weight="700">to stay ordinary —</text>
      <text class="sans" x="175" y="82" text-anchor="middle" fill="#7c4dff" font-size="14" font-style="italic">sharp, loud, unbreakable.</text>
    </g>

    <!-- lower narration strip -->
    <g transform="translate(400,200)">
      <rect width="370" height="44" fill="#1a1a28" stroke="#b388ff" stroke-width="2"/>
      <text class="mono" x="185" y="20" text-anchor="middle" fill="#ffd54f" font-size="12" letter-spacing="2">FULL-STACK APPS · AI TOOLS · DATA PIPELINES</text>
      <text class="mono" x="185" y="37" text-anchor="middle" fill="#b0b0b8" font-size="11">CURRENT ARC: shipping · open source · never give up</text>
    </g>

    <!-- panel border -->
    <rect x="8" y="8" width="784" height="244" fill="none" stroke="#000" stroke-width="6"/>
    <rect x="16" y="16" width="768" height="228" fill="none" stroke="#f0ebe0" stroke-width="2"/>
  </g>
</svg>
