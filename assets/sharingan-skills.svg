<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Itachi Sharingan awakening scene with technique reveal">
  <defs>
    <radialGradient id="sceneBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="55%" stop-color="#140404"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="irisG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="35%" stop-color="#e01b24"/>
      <stop offset="75%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>
    <radialGradient id="redPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e01b24" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#e01b24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <filter id="eyeHot" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amaF" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cardSh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <clipPath id="eL"><ellipse cx="150" cy="150" rx="70" ry="46"/></clipPath>
    <clipPath id="eR"><ellipse cx="310" cy="150" rx="70" ry="46"/></clipPath>
    <clipPath id="frame"><rect x="6" y="6" width="788" height="348" rx="4"/></clipPath>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    .mono { font-family: Consolas, monospace; }
    @keyframes tomoeSpin { to { transform: rotate(360deg); } }
    .tSpin { transform-box: fill-box; transform-origin: center; animation: tomoeSpin 4s linear infinite; }
    @keyframes ama { 0%,100% { opacity:.4; } 50% { opacity:.95; } }
    .ama { animation: ama 2.2s ease-in-out infinite; }
    @keyframes blinkD { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .dots { animation: blinkD 1.1s step-end infinite; }
    @keyframes cardIn { from { opacity:0; transform: translateX(40px) rotate(3deg); } to { opacity:1; transform: translateX(0) rotate(0); } }
    .card { animation: cardIn .6s ease-out both; }
    @keyframes irisWake { 0%,100% { opacity:.88; } 50% { opacity:1; } }
    .iris { animation: irisWake 2.5s ease-in-out infinite; }
    @keyframes redFlash { 0%,100% { opacity:.25; } 50% { opacity:.7; } }
    .rf { animation: redFlash 3s ease-in-out infinite; }
  </style>

  <rect width="800" height="360" fill="#050508"/>

  <g clip-path="url(#frame)">
    <!-- atmospheric crimson vignette -->
    <rect width="800" height="360" fill="url(#sceneBg)"/>
    <ellipse cx="230" cy="160" rx="280" ry="200" fill="url(#redPulse)" class="rf"/>

    <!-- Amaterasu black flames rising from bottom -->
    <g filter="url(#amaF)" class="ama">
      <path d="M40,360 Q30,300 70,280 Q60,240 110,250 Q130,210 170,245 Q210,215 220,260 Q260,250 255,300 Q280,320 260,360 Z" fill="#0a0000" opacity=".85"/>
      <path d="M300,360 Q290,310 330,295 Q340,255 380,270 Q420,245 430,290 Q470,285 465,330 Q460,350 450,360 Z" fill="#0a0000" opacity=".75"/>
      <path d="M560,360 Q555,315 590,300 Q600,260 640,280 Q680,255 690,300 Q730,300 725,340 Q720,355 715,360 Z" fill="#0a0000" opacity=".7"/>
      <!-- crimson flame inner glow -->
      <path d="M80,360 Q90,310 130,300 Q150,270 180,295 Q210,310 200,360 Z" fill="#e01b24" opacity=".35"/>
      <path d="M340,360 Q355,320 390,315 Q420,330 415,360 Z" fill="#e01b24" opacity=".3"/>
      <path d="M610,360 Q625,325 655,320 Q685,335 680,360 Z" fill="#e01b24" opacity=".3"/>
    </g>

    <!-- radial speed lines (awakening) -->
    <g stroke="#e01b24" stroke-width="2.5" opacity=".35">
      <line x1="230" y1="150" x2="30" y2="40"/>
      <line x1="230" y1="150" x2="30" y2="150"/>
      <line x1="230" y1="150" x2="30" y2="260"/>
      <line x1="230" y1="150" x2="120" y2="340"/>
      <line x1="230" y1="150" x2="230" y2="350"/>
      <line x1="230" y1="150" x2="380" y2="340"/>
      <line x1="230" y1="150" x2="400" y2="40"/>
      <line x1="230" y1="150" x2="400" y2="150"/>
    </g>

    <!-- ===== LEFT: SHARINGAN AWAKENING (the scene) ===== -->
    <!-- LEFT EYE large -->
    <g>
      <ellipse cx="150" cy="150" rx="78" ry="54" fill="#f5e6d0" stroke="#3a0000" stroke-width="3"/>
      <g clip-path="url(#eL)">
        <g class="iris">
          <circle cx="150" cy="150" r="42" fill="url(#irisG)" filter="url(#eyeHot)"/>
          <circle cx="150" cy="150" r="50" fill="url(#redPulse)"/>
          <g class="tSpin">
            <g transform="translate(150,150)">
              <g>
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
              <g transform="rotate(120)">
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
              <g transform="rotate(240)">
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
            </g>
          </g>
          <circle cx="150" cy="150" r="10" fill="#0a0000"/>
          <circle cx="143" cy="141" r="6" fill="#fff" opacity=".75"/>
        </g>
        <!-- brief closed then open -->
        <rect x="72" y="96" width="156" height="108" fill="#f5e6d0" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.08;0.1;0.12;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </g>
      <ellipse cx="150" cy="150" rx="78" ry="54" fill="none" stroke="#2a0000" stroke-width="4"/>
      <!-- brow shadow -->
      <path d="M72,110 Q150,88 228,110" fill="none" stroke="#1a0000" stroke-width="8" opacity=".5"/>
    </g>

    <!-- RIGHT EYE large -->
    <g>
      <ellipse cx="310" cy="150" rx="78" ry="54" fill="#f5e6d0" stroke="#3a0000" stroke-width="3"/>
      <g clip-path="url(#eR)">
        <g class="iris">
          <circle cx="310" cy="150" r="42" fill="url(#irisG)" filter="url(#eyeHot)"/>
          <circle cx="310" cy="150" r="50" fill="url(#redPulse)"/>
          <g class="tSpin" style="animation-direction:reverse">
            <g transform="translate(310,150)">
              <g>
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
              <g transform="rotate(120)">
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
              <g transform="rotate(240)">
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
            </g>
          </g>
          <circle cx="310" cy="150" r="10" fill="#0a0000"/>
          <circle cx="303" cy="141" r="6" fill="#fff" opacity=".75"/>
        </g>
        <rect x="232" y="96" width="156" height="108" fill="#f5e6d0" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.08;0.1;0.12;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </g>
      <ellipse cx="310" cy="150" rx="78" ry="54" fill="none" stroke="#2a0000" stroke-width="4"/>
      <path d="M232,110 Q310,88 388,110" fill="none" stroke="#1a0000" stroke-width="8" opacity=".5"/>
    </g>

    <!-- ellipsis "..." awakening text (typing dots) -->
    <text class="disp" x="230" y="235" text-anchor="middle" fill="#e01b24" font-size="36" letter-spacing="6" filter="url(#eyeHot)">
      <tspan opacity="0">.</tspan><tspan opacity="0">.</tspan><tspan opacity="0">.</tspan>
      <animate attributeName="fill" values="#e01b24;#ff6b6b;#e01b24" dur="2s" repeatCount="indefinite"/>
      <!-- sequential dot reveal -->
      <set attributeName="opacity" to="1" begin="1s"/><tspan><animate attributeName="opacity" values="0;1" dur=".01s" begin="1.2s" fill="freeze"/></tspan>
    </text>
    <!-- clearer ellipsis as separate elements -->
    <g fill="#e01b24" class="dots">
      <circle cx="205" cy="232" r="6" opacity="0"><animate attributeName="opacity" values="0;1" dur=".01s" begin="1.2s" fill="freeze"/></circle>
      <circle cx="230" cy="232" r="6" opacity="0"><animate attributeName="opacity" values="0;1" dur=".01s" begin="1.6s" fill="freeze"/></circle>
      <circle cx="255" cy="232" r="6" opacity="0"><animate attributeName="opacity" values="0;1" dur=".01s" begin="2s" fill="freeze"/></circle>
    </g>

    <text class="disp" x="230" y="275" text-anchor="middle" fill="#ffffff" font-size="20" letter-spacing="5">SHARINGAN</text>
    <text class="sans" x="230" y="300" text-anchor="middle" fill="#e01b24" font-size="13" font-style="italic" letter-spacing="2">Awakening... power unsealed</text>

    <!-- vertical divider like manga panel gutter -->
    <rect x="418" y="20" width="5" height="320" fill="#000000"/>
    <rect x="424" y="20" width="2" height="320" fill="#f0ebe0" opacity=".2"/>

    <!-- ===== RIGHT: technique cards revealed by eye power ===== -->
    <text class="disp" x="460" y="48" fill="#ffd54f" font-size="22" letter-spacing="3">TECHNIQUES</text>
    <text class="sans" x="460" y="70" fill="#e01b24" font-size="13" font-style="italic" letter-spacing="1">The eyes reveal the equipped skills...</text>

    <!-- technique cards (fly in) -->
    <g class="card" style="animation-delay:.3s" filter="url(#cardSh)">
      <g transform="translate(460,88) skewX(-6)">
        <rect width="300" height="42" rx="3" fill="url(#cardG)" stroke="#e01b24" stroke-width="2"/>
        <rect x="0" y="0" width="8" height="42" fill="#ff7a1a"/>
        <text class="disp" x="24" y="28" fill="#ffffff" font-size="18" letter-spacing="2">PYTHON</text>
        <text class="disp" x="275" y="28" text-anchor="end" fill="#ffd54f" font-size="20">92</text>
        <!-- mini bar as energy meter -->
        <rect x="130" y="16" width="110" height="10" rx="2" fill="#0a0a10" stroke="#333"/>
        <rect x="132" y="18" width="101" height="6" rx="1" fill="#ff7a1a"/>
      </g>
    </g>
    <g class="card" style="animation-delay:.5s" filter="url(#cardSh)">
      <g transform="translate(460,140) skewX(-6)">
        <rect width="300" height="42" rx="3" fill="url(#cardG)" stroke="#ffd54f" stroke-width="2"/>
        <rect x="0" y="0" width="8" height="42" fill="#ffd54f"/>
        <text class="disp" x="24" y="28" fill="#ffffff" font-size="18" letter-spacing="2">TYPESCRIPT</text>
        <text class="disp" x="275" y="28" text-anchor="end" fill="#ffd54f" font-size="20">88</text>
        <rect x="130" y="16" width="110" height="10" rx="2" fill="#0a0a10" stroke="#333"/>
        <rect x="132" y="18" width="97" height="6" rx="1" fill="#ffd54f"/>
      </g>
    </g>
    <g class="card" style="animation-delay:.7s" filter="url(#cardSh)">
      <g transform="translate(460,192) skewX(-6)">
        <rect width="300" height="42" rx="3" fill="url(#cardG)" stroke="#2ec4b6" stroke-width="2"/>
        <rect x="0" y="0" width="8" height="42" fill="#2ec4b6"/>
        <text class="disp" x="24" y="28" fill="#ffffff" font-size="18" letter-spacing="2">REACT / NEXT.JS</text>
        <text class="disp" x="275" y="28" text-anchor="end" fill="#ffd54f" font-size="20">85</text>
        <rect x="130" y="16" width="110" height="10" rx="2" fill="#0a0a10" stroke="#333"/>
        <rect x="132" y="18" width="94" height="6" rx="1" fill="#2ec4b6"/>
      </g>
    </g>
    <g class="card" style="animation-delay:.9s" filter="url(#cardSh)">
      <g transform="translate(460,244) skewX(-6)">
        <rect width="300" height="42" rx="3" fill="url(#cardG)" stroke="#7ae582" stroke-width="2"/>
        <rect x="0" y="0" width="8" height="42" fill="#7ae582"/>
        <text class="disp" x="24" y="28" fill="#ffffff" font-size="18" letter-spacing="2">NODE / APIs</text>
        <text class="disp" x="275" y="28" text-anchor="end" fill="#ffd54f" font-size="20">80</text>
        <rect x="130" y="16" width="110" height="10" rx="2" fill="#0a0a10" stroke="#333"/>
        <rect x="132" y="18" width="88" height="6" rx="1" fill="#7ae582"/>
      </g>
    </g>
    <g class="card" style="animation-delay:1.1s" filter="url(#cardSh)">
      <g transform="translate(460,296) skewX(-6)">
        <rect width="300" height="42" rx="3" fill="url(#cardG)" stroke="#e01b24" stroke-width="2"/>
        <rect x="0" y="0" width="8" height="42" fill="#e01b24"/>
        <text class="disp" x="24" y="28" fill="#ffffff" font-size="18" letter-spacing="2">SQL / AI</text>
        <text class="disp" x="275" y="28" text-anchor="end" fill="#ffd54f" font-size="20">78</text>
        <rect x="130" y="16" width="110" height="10" rx="2" fill="#0a0a10" stroke="#333"/>
        <rect x="132" y="18" width="86" height="6" rx="1" fill="#e01b24"/>
      </g>
    </g>

    <!-- panel border -->
    <rect x="6" y="6" width="788" height="348" fill="none" stroke="#f0ebe0" stroke-width="5"/>
    <rect x="14" y="14" width="772" height="332" fill="none" stroke="#e01b24" stroke-width="1.5" opacity=".5"/>
  </g>
</svg>
