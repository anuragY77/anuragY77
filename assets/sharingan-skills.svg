<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-label="Itachi Sharingan awakening scene with skill databook">
  <defs>
    <radialGradient id="sceneBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="55%" stop-color="#140404"/>
      <stop offset="100%" stop-color="#0a0204"/>
    </radialGradient>
    <radialGradient id="irisG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="35%" stop-color="#e01b24"/>
      <stop offset="75%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>
    <radialGradient id="redPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e01b24" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#e01b24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sTone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.8" cy="1.8" r="1" fill="#141414" opacity=".1"/>
    </pattern>
    <filter id="eyeHot" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amaF" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cardSh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="4" stdDeviation="1" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <clipPath id="eL"><ellipse cx="150" cy="155" rx="70" ry="46"/></clipPath>
    <clipPath id="eR"><ellipse cx="310" cy="155" rx="70" ry="46"/></clipPath>
    <clipPath id="frame"><rect x="8" y="8" width="784" height="354"/></clipPath>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    @keyframes tomoeSpin { to { transform: rotate(360deg); } }
    .tSpin { transform-box: fill-box; transform-origin: center; animation: tomoeSpin 4s linear infinite; }
    @keyframes ama { 0%,100% { opacity:.4; } 50% { opacity:.95; } }
    .ama { animation: ama 2.2s ease-in-out infinite; }
    @keyframes blinkD { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .dots { animation: blinkD 1.1s step-end infinite; }
    @keyframes cardIn { from { transform: translateX(28px); } to { transform: translateX(0); } }
    .card { opacity: 1; animation: cardIn .6s ease-out both; }
    @keyframes irisWake { 0%,100% { opacity:.88; } 50% { opacity:1; } }
    .iris { animation: irisWake 2.5s ease-in-out infinite; }
    @keyframes redFlash { 0%,100% { opacity:.25; } 50% { opacity:.7; } }
    .rf { animation: redFlash 3s ease-in-out infinite; }
  </style>

  <!-- manga paper page -->
  <rect width="800" height="370" fill="#f7f1e3"/>

  <g clip-path="url(#frame)">
    <!-- ===== LEFT: crimson anime scene ===== -->
    <rect x="8" y="8" width="410" height="354" fill="url(#sceneBg)"/>
    <ellipse cx="210" cy="160" rx="240" ry="190" fill="url(#redPulse)" class="rf"/>

    <!-- Amaterasu flames -->
    <g filter="url(#amaF)" class="ama">
      <path d="M40,362 Q30,300 70,280 Q60,240 110,250 Q130,210 170,245 Q210,215 220,260 Q260,250 255,300 Q280,320 260,362 Z" fill="#0a0000" opacity=".85"/>
      <path d="M300,362 Q290,310 330,295 Q340,255 380,270 Q400,245 405,290 Q400,330 395,362 Z" fill="#0a0000" opacity=".75"/>
      <path d="M80,362 Q90,310 130,300 Q150,270 180,295 Q210,310 200,362 Z" fill="#e01b24" opacity=".35"/>
      <path d="M330,362 Q345,320 375,315 Q395,330 390,362 Z" fill="#e01b24" opacity=".3"/>
    </g>

    <!-- radial awakening lines -->
    <g stroke="#e01b24" stroke-width="2.5" opacity=".35">
      <line x1="230" y1="155" x2="30" y2="40"/>
      <line x1="230" y1="155" x2="20" y2="155"/>
      <line x1="230" y1="155" x2="30" y2="270"/>
      <line x1="230" y1="155" x2="120" y2="350"/>
      <line x1="230" y1="155" x2="230" y2="355"/>
      <line x1="230" y1="155" x2="340" y2="350"/>
      <line x1="230" y1="155" x2="400" y2="40"/>
      <line x1="230" y1="155" x2="410" y2="155"/>
    </g>

    <!-- LEFT EYE -->
    <g>
      <ellipse cx="150" cy="155" rx="78" ry="54" fill="#f5e6d0" stroke="#3a0000" stroke-width="3"/>
      <g clip-path="url(#eL)">
        <g class="iris">
          <circle cx="150" cy="155" r="42" fill="url(#irisG)" filter="url(#eyeHot)"/>
          <circle cx="150" cy="155" r="50" fill="url(#redPulse)"/>
          <g class="tSpin">
            <g transform="translate(150,155)">
              <g>
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
              <g transform="rotate(120)">
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
              <g transform="rotate(240)">
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
            </g>
          </g>
          <circle cx="150" cy="155" r="10" fill="#0a0000"/>
          <circle cx="143" cy="146" r="6" fill="#fff" opacity=".75"/>
        </g>
        <rect x="72" y="101" width="156" height="108" fill="#f5e6d0" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.08;0.1;0.12;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </g>
      <ellipse cx="150" cy="155" rx="78" ry="54" fill="none" stroke="#2a0000" stroke-width="4"/>
      <path d="M72,115 Q150,93 228,115" fill="none" stroke="#1a0000" stroke-width="8" opacity=".5"/>
    </g>

    <!-- RIGHT EYE -->
    <g>
      <ellipse cx="310" cy="155" rx="78" ry="54" fill="#f5e6d0" stroke="#3a0000" stroke-width="3"/>
      <g clip-path="url(#eR)">
        <g class="iris">
          <circle cx="310" cy="155" r="42" fill="url(#irisG)" filter="url(#eyeHot)"/>
          <circle cx="310" cy="155" r="50" fill="url(#redPulse)"/>
          <g class="tSpin" style="animation-direction:reverse">
            <g transform="translate(310,155)">
              <g>
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
              <g transform="rotate(120)">
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
              <g transform="rotate(240)">
                <circle cx="0" cy="-24" r="7" fill="#120000"/>
                <path d="M-4,-24 Q0,-12 4,-24 Q8,-20 4,-12 Q0,-16 -4,-12 Q-8,-20 -4,-24" fill="#120000"/>
              </g>
            </g>
          </g>
          <circle cx="310" cy="155" r="10" fill="#0a0000"/>
          <circle cx="303" cy="146" r="6" fill="#fff" opacity=".75"/>
        </g>
        <rect x="232" y="101" width="156" height="108" fill="#f5e6d0" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.08;0.1;0.12;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </g>
      <ellipse cx="310" cy="155" rx="78" ry="54" fill="none" stroke="#2a0000" stroke-width="4"/>
      <path d="M232,115 Q310,93 388,115" fill="none" stroke="#1a0000" stroke-width="8" opacity=".5"/>
    </g>

    <!-- ellipsis dots -->
    <g fill="#ff6b6b" class="dots">
      <circle cx="205" cy="235" r="6" opacity="0"><animate attributeName="opacity" values="0;1" dur=".01s" begin="1.2s" fill="freeze"/></circle>
      <circle cx="230" cy="235" r="6" opacity="0"><animate attributeName="opacity" values="0;1" dur=".01s" begin="1.6s" fill="freeze"/></circle>
      <circle cx="255" cy="235" r="6" opacity="0"><animate attributeName="opacity" values="0;1" dur=".01s" begin="2s" fill="freeze"/></circle>
    </g>

    <!-- yellow caption on scene -->
    <g transform="translate(60,268)">
      <rect width="300" height="72" fill="#ffd166" stroke="#141414" stroke-width="4"/>
      <text class="disp" x="150" y="32" text-anchor="middle" fill="#141414" font-size="26" letter-spacing="6">SHARINGAN</text>
      <text class="sans" x="150" y="56" text-anchor="middle" fill="#e60012" font-size="14" font-style="italic" font-weight="700">Awakening... power unsealed</text>
    </g>

    <!-- ===== manga gutter ===== -->
    <rect x="418" y="8" width="10" height="354" fill="#141414"/>

    <!-- ===== RIGHT: paper databook page ===== -->
    <rect x="428" y="8" width="364" height="354" fill="#f7f1e3"/>
    <rect x="428" y="8" width="364" height="354" fill="url(#sTone)"/>

    <text class="disp" x="452" y="48" fill="#141414" font-size="26" letter-spacing="3">TECHNIQUES</text>
    <text class="sans" x="452" y="70" fill="#e60012" font-size="13" font-style="italic" font-weight="700">The eyes reveal the equipped skills...</text>
    <rect x="452" y="78" width="316" height="4" fill="#e60012"/>

    <!-- skill cards — white manga databook style -->
    <g class="card" style="animation-delay:.3s" filter="url(#cardSh)">
      <g transform="translate(452,96)">
        <rect width="316" height="44" fill="#ffffff" stroke="#141414" stroke-width="3"/>
        <rect width="10" height="44" fill="#ff6a00"/>
        <text class="disp" x="24" y="22" fill="#141414" font-size="17" letter-spacing="1">PYTHON</text>
        <rect x="24" y="28" width="230" height="10" fill="#f0ebe0" stroke="#141414" stroke-width="1.5"/>
        <rect x="26" y="30" width="212" height="6" fill="#ff6a00"/>
        <text class="disp" x="300" y="32" text-anchor="end" fill="#e60012" font-size="20">92</text>
      </g>
    </g>
    <g class="card" style="animation-delay:.5s" filter="url(#cardSh)">
      <g transform="translate(452,150)">
        <rect width="316" height="44" fill="#ffffff" stroke="#141414" stroke-width="3"/>
        <rect width="10" height="44" fill="#e60012"/>
        <text class="disp" x="24" y="22" fill="#141414" font-size="17" letter-spacing="1">TYPESCRIPT</text>
        <rect x="24" y="28" width="230" height="10" fill="#f0ebe0" stroke="#141414" stroke-width="1.5"/>
        <rect x="26" y="30" width="202" height="6" fill="#e60012"/>
        <text class="disp" x="300" y="32" text-anchor="end" fill="#e60012" font-size="20">88</text>
      </g>
    </g>
    <g class="card" style="animation-delay:.7s" filter="url(#cardSh)">
      <g transform="translate(452,204)">
        <rect width="316" height="44" fill="#ffffff" stroke="#141414" stroke-width="3"/>
        <rect width="10" height="44" fill="#0d9488"/>
        <text class="disp" x="24" y="22" fill="#141414" font-size="17" letter-spacing="1">REACT / NEXT.JS</text>
        <rect x="24" y="28" width="230" height="10" fill="#f0ebe0" stroke="#141414" stroke-width="1.5"/>
        <rect x="26" y="30" width="196" height="6" fill="#0d9488"/>
        <text class="disp" x="300" y="32" text-anchor="end" fill="#e60012" font-size="20">85</text>
      </g>
    </g>
    <g class="card" style="animation-delay:.9s" filter="url(#cardSh)">
      <g transform="translate(452,258)">
        <rect width="316" height="44" fill="#ffffff" stroke="#141414" stroke-width="3"/>
        <rect width="10" height="44" fill="#2e7d32"/>
        <text class="disp" x="24" y="22" fill="#141414" font-size="17" letter-spacing="1">NODE / APIs</text>
        <rect x="24" y="28" width="230" height="10" fill="#f0ebe0" stroke="#141414" stroke-width="1.5"/>
        <rect x="26" y="30" width="184" height="6" fill="#2e7d32"/>
        <text class="disp" x="300" y="32" text-anchor="end" fill="#e60012" font-size="20">80</text>
      </g>
    </g>
    <g class="card" style="animation-delay:1.1s" filter="url(#cardSh)">
      <g transform="translate(452,312)">
        <rect width="316" height="44" fill="#ffffff" stroke="#141414" stroke-width="3"/>
        <rect width="10" height="44" fill="#7c4dff"/>
        <text class="disp" x="24" y="22" fill="#141414" font-size="17" letter-spacing="1">SQL / AI</text>
        <rect x="24" y="28" width="230" height="10" fill="#f0ebe0" stroke="#141414" stroke-width="1.5"/>
        <rect x="26" y="30" width="180" height="6" fill="#7c4dff"/>
        <text class="disp" x="300" y="32" text-anchor="end" fill="#e60012" font-size="20">78</text>
      </g>
    </g>
  </g>

  <!-- thick manga ink border -->
  <rect x="4" y="4" width="792" height="362" fill="none" stroke="#141414" stroke-width="8"/>
</svg>
