<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Animated terminal intro for Anurag Yadav">
  <defs>
    <linearGradient id="tBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="tUnder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tl1"><rect x="0" y="52" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.4s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="tl2"><rect x="0" y="80" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.4s" begin="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="tl3"><rect x="0" y="108" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.4s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="tl4"><rect x="0" y="136" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.2s" begin="2.7s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .mono { font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace; }
    @keyframes tbBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes tbPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes chipGlow { 0%,100% { stroke-opacity: .5; } 50% { stroke-opacity: 1; } }
    .tbCur { animation: tbBlink 0.95s step-end infinite; }
    .tbDot { animation: tbPulse 1.8s ease-in-out infinite; }
    .chip { animation: chipGlow 2.6s ease-in-out infinite; }
    .chip2 { animation: chipGlow 2.6s ease-in-out infinite .4s; }
    .chip3 { animation: chipGlow 2.6s ease-in-out infinite .8s; }
    .chip4 { animation: chipGlow 2.6s ease-in-out infinite 1.2s; }
    .chip5 { animation: chipGlow 2.6s ease-in-out infinite 1.6s; }
    .chip6 { animation: chipGlow 2.6s ease-in-out infinite 2s; }
  </style>

  <!-- window -->
  <rect width="800" height="260" rx="0" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="259" fill="none" stroke="#22d3ee" stroke-opacity="0.4"/>

  <!-- title bar -->
  <rect x="1" y="1" width="798" height="36" fill="url(#tBar)"/>
  <line x1="1" y1="37" x2="799" y2="37" stroke="#22d3ee" stroke-opacity="0.35"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57" opacity="0.9"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e" opacity="0.9"/>
  <circle cx="62" cy="19" r="6" fill="#3fb950" opacity="0.9" class="tbDot"/>
  <text class="mono" x="400" y="24" text-anchor="middle" fill="#8b949e" font-size="13">neural_interface.sh &#8212; bash &#8212; 80x24</text>
  <text class="mono" x="780" y="24" text-anchor="end" fill="#3fb950" font-size="11" letter-spacing="1" filter="url(#tGlow)">REC</text>

  <!-- typed lines -->
  <g class="mono" font-size="14">
    <g clip-path="url(#tl1)">
      <text x="24" y="68" fill="#56d4dd">$ <tspan fill="#e6edf3">./init --profile anuragY77</tspan> <tspan fill="#3fb950" filter="url(#tGlow)">[OK]</tspan></text>
    </g>
    <g clip-path="url(#tl2)">
      <text x="24" y="96" fill="#56d4dd">$ <tspan fill="#e6edf3">load stack: python | ts | react | next | pg</tspan> <tspan fill="#3fb950" filter="url(#tGlow)">[OK]</tspan></text>
    </g>
    <g clip-path="url(#tl3)">
      <text x="24" y="124" fill="#56d4dd">$ <tspan fill="#e6edf3">mode: FULL_STACK // DATA_ANALYTICS // AI_ML</tspan> <tspan fill="#3fb950" filter="url(#tGlow)">[OK]</tspan></text>
    </g>
    <g clip-path="url(#tl4)">
      <text x="24" y="152" fill="#56d4dd">$ <tspan fill="#c084fc">Turning data and code into products</tspan><tspan class="tbCur" fill="#56d4dd">_</tspan></text>
    </g>
  </g>

  <!-- scanning shimmer over terminal -->
  <rect x="1" y="38" width="798" height="3" fill="url(#tBeam)" opacity="0.35">
    <animate attributeName="y" values="38;255;38" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- skill chips -->
  <g class="mono" font-size="13">
    <g class="chip">
      <rect x="24" y="178" width="106" height="34" rx="4" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="77" y="200" text-anchor="middle" fill="#22d3ee">Python</text>
    </g>
    <g class="chip2">
      <rect x="144" y="178" width="122" height="34" rx="4" fill="#161b22" stroke="#c084fc" stroke-width="1.5"/>
      <text x="205" y="200" text-anchor="middle" fill="#c084fc">TypeScript</text>
    </g>
    <g class="chip3">
      <rect x="280" y="178" width="86" height="34" rx="4" fill="#161b22" stroke="#56d4dd" stroke-width="1.5"/>
      <text x="323" y="200" text-anchor="middle" fill="#56d4dd">React</text>
    </g>
    <g class="chip4">
      <rect x="380" y="178" width="96" height="34" rx="4" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="428" y="200" text-anchor="middle" fill="#22d3ee">Next.js</text>
    </g>
    <g class="chip5">
      <rect x="490" y="178" width="106" height="34" rx="4" fill="#161b22" stroke="#c084fc" stroke-width="1.5"/>
      <text x="543" y="200" text-anchor="middle" fill="#c084fc">Node.js</text>
    </g>
    <g class="chip6">
      <rect x="610" y="178" width="130" height="34" rx="4" fill="#161b22" stroke="#56d4dd" stroke-width="1.5"/>
      <text x="675" y="200" text-anchor="middle" fill="#56d4dd">PostgreSQL</text>
    </g>
  </g>

  <!-- footer status row -->
  <text class="mono" x="24" y="240" fill="#8b949e" font-size="11">SYSTEM:// <tspan fill="#56d4dd">profile.core</tspan> loaded &#183; awaiting next command<tspan class="tbCur" fill="#c084fc">_</tspan></text>
  <text class="mono" x="776" y="240" text-anchor="end" fill="#3fb950" font-size="11" filter="url(#tGlow)">ONLINE</text>

  <rect x="1" y="256" width="798" height="3" fill="url(#tUnder)" opacity="0.9"/>
</svg>
