<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="800" height="48" role="img" aria-label="Anime eyecatch divider">
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#12101a"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="dBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff7a1a"/>
      <stop offset="55%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; font-style: italic; font-weight: 700; }
    @keyframes fl { 0%,100% { opacity:1; } 50% { opacity:.45; } }
    .f { animation: fl 1.6s ease-in-out infinite; }
    @keyframes sw { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .s { animation: sw 2s ease-in-out infinite; }
  </style>

  <rect width="800" height="48" fill="url(#dBg)"/>

  <!-- manga speed lines -->
  <g stroke="#ffffff" stroke-width="2" opacity=".14">
    <line x1="0" y1="8" x2="180" y2="20"/>
    <line x1="0" y1="40" x2="200" y2="30"/>
    <line x1="800" y1="8" x2="620" y2="20"/>
    <line x1="800" y1="40" x2="600" y2="30"/>
  </g>
  <!-- slash marks -->
  <g stroke="#ffd54f" stroke-width="3" stroke-linecap="round" filter="url(#dGlow)">
    <line x1="46" y1="34" x2="96" y2="14"/>
    <line x1="704" y1="14" x2="754" y2="34"/>
  </g>

  <!-- center eyecatch badge -->
  <g transform="translate(400,24)">
    <g transform="skewX(-10)">
      <rect x="-168" y="-15" width="336" height="30" fill="#050508" stroke="#ff7a1a" stroke-width="2"/>
      <rect x="-160" y="-11" width="320" height="22" fill="none" stroke="#ffd54f" stroke-opacity=".35"/>
    </g>
    <text class="disp f" x="-140" y="6" fill="#e01b24" font-size="14" letter-spacing="4">EYECATCH</text>
    <text class="sans" x="140" y="6" text-anchor="end" fill="#ffd54f" font-size="13" letter-spacing="3">COMMERCIAL BREAK</text>
    <text class="disp s" x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="15" letter-spacing="2">&#10022;</text>
  </g>

  <!-- gold energy bar -->
  <rect x="0" y="44" width="800" height="4" fill="url(#dBar)"/>
  <rect x="-70" y="44" width="70" height="4" fill="url(#dBeam)">
    <animate attributeName="x" values="-70;800" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
