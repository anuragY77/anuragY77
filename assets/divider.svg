<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="800" height="48" role="img" aria-label="Anime eyecatch divider">
  <defs>
    <linearGradient id="eBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#14121c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="eLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff7a1a"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="70%" stop-color="#ff3b5c"/>
      <stop offset="100%" stop-color="#ff3b5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="eGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes eP { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes eB { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .p1 { animation: eP 2s ease-in-out infinite; }
    .p2 { animation: eP 2s ease-in-out infinite .4s; }
    .p3 { animation: eP 2s ease-in-out infinite .8s; }
    .b { animation: eB 1.1s step-end infinite; }
  </style>

  <rect width="800" height="48" fill="url(#eBg)"/>
  <rect width="800" height="48" fill="none" stroke="#ffd166" stroke-opacity="0.25"/>

  <!-- speed ticks -->
  <g stroke="#ff7a1a" stroke-width="2" opacity="0.7">
    <line x1="40" y1="24" x2="120" y2="24"/>
    <line x1="680" y1="24" x2="760" y2="24"/>
  </g>
  <g stroke="#ffd166" stroke-width="1.4" opacity="0.55">
    <line x1="130" y1="24" x2="190" y2="24"/>
    <line x1="610" y1="24" x2="670" y2="24"/>
  </g>

  <!-- center shuriken/compass emblem -->
  <g filter="url(#eGlow)">
    <circle cx="400" cy="24" r="14" fill="none" stroke="#ffd166" stroke-width="2"/>
    <circle cx="400" cy="24" r="7" fill="#ff7a1a" class="p1"/>
    <g stroke="#2ec4b6" stroke-width="2" class="p2">
      <line x1="400" y1="6" x2="400" y2="12"/>
      <line x1="400" y1="36" x2="400" y2="42"/>
      <line x1="382" y1="24" x2="388" y2="24"/>
      <line x1="412" y1="24" x2="418" y2="24"/>
    </g>
  </g>

  <!-- eyesch Japanese label -->
  <text class="p2" x="430" y="28" fill="#f5e6c8" font-family="Consolas,monospace" font-size="11" letter-spacing="3" filter="url(#eGlow)">EYECATCH &#183; 番組編成</text>
  <text x="370" y="28" text-anchor="end" fill="#7ae582" font-family="Consolas,monospace" font-size="11" letter-spacing="2" class="p3">-- COMMERCIAL --</text>

  <!-- nodes -->
  <circle cx="240" cy="24" r="2.6" fill="#ff7a1a" class="p1"/>
  <circle cx="300" cy="24" r="2.6" fill="#ffd166" class="p2"/>
  <circle cx="500" cy="24" r="2.6" fill="#ff3b5c" class="p3"/>
  <circle cx="560" cy="24" r="2.6" fill="#2ec4b6" class="p1"/>

  <!-- bottom gradient -->
  <rect x="0" y="45" width="800" height="3" fill="url(#eLine)" opacity="0.9"/>
  <rect x="-60" y="45" width="60" height="3" fill="url(#eBeam)">
    <animate attributeName="x" values="-60;800" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
