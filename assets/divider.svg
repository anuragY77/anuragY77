<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" width="800" height="44" role="img" aria-label="Cyberpunk section divider">
  <defs>
    <linearGradient id="dLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="15%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#56d4dd"/>
      <stop offset="85%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dDiamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="dGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dGlowS" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes dPulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    .n1 { animation: dPulse 2.4s ease-in-out infinite; }
    .n2 { animation: dPulse 2.4s ease-in-out infinite .5s; }
    .n3 { animation: dPulse 2.4s ease-in-out infinite 1s; }
    .n4 { animation: dPulse 2.4s ease-in-out infinite 1.5s; }
  </style>

  <!-- solid dark bar so it pops on light AND dark mode -->
  <rect width="800" height="44" fill="#0d1117"/>
  <rect width="800" height="44" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>

  <line x1="30" y1="22" x2="770" y2="22" stroke="url(#dLine)" stroke-width="1.8" filter="url(#dGlow)"/>

  <!-- traveling beam -->
  <rect x="-70" y="20.5" width="70" height="3" fill="url(#dBeam)" filter="url(#dGlowS)">
    <animate attributeName="x" values="-70;800" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- side nodes -->
  <circle cx="300" cy="22" r="2.8" fill="#22d3ee" class="n2" filter="url(#dGlowS)"/>
  <circle cx="500" cy="22" r="2.8" fill="#c084fc" class="n3" filter="url(#dGlowS)"/>
  <circle cx="210" cy="22" r="1.8" fill="#56d4dd" class="n4"/>
  <circle cx="590" cy="22" r="1.8" fill="#c084fc" class="n1"/>
  <circle cx="120" cy="22" r="1.4" fill="#22d3ee" opacity="0.6" class="n2"/>
  <circle cx="680" cy="22" r="1.4" fill="#56d4dd" opacity="0.6" class="n3"/>
  <rect x="368" y="19.5" width="12" height="5" rx="1" fill="#22d3ee" opacity="0.8" class="n2"/>
  <rect x="420" y="19.5" width="12" height="5" rx="1" fill="#c084fc" opacity="0.8" class="n3"/>

  <!-- center diamond -->
  <g filter="url(#dGlow)">
    <rect x="390" y="10" width="24" height="24" rx="2" transform="rotate(45 402 22)" fill="#0d1117" stroke="url(#dDiamond)" stroke-width="2"/>
    <rect x="396.5" y="16.5" width="11" height="11" transform="rotate(45 402 22)" fill="#56d4dd" class="n1"/>
  </g>

  <!-- corner ticks -->
  <g stroke="#56d4dd" stroke-width="1.3" opacity="0.7">
    <path d="M14,12 L14,32"/>
    <path d="M786,12 L786,32"/>
  </g>
</svg>
