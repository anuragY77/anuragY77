<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 52" width="800" height="52" role="img" aria-label="Anime eyecatch divider">
  <defs>
    <pattern id="dTone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141414" opacity=".08"/>
    </pattern>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; font-style: italic; font-weight: 700; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
    @keyframes slide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    .p { animation: pulse 1.5s ease-in-out infinite; }
    .s { animation: slide 2s ease-in-out infinite; }
  </style>

  <!-- manga paper strip -->
  <rect width="800" height="52" fill="#f7f1e3"/>
  <rect width="800" height="52" fill="url(#dTone)"/>

  <!-- black speed lines -->
  <g stroke="#141414" stroke-width="2.5" opacity=".2" stroke-linecap="round">
    <line x1="20" y1="14" x2="200" y2="22"/>
    <line x1="30" y1="40" x2="220" y2="34"/>
    <line x1="780" y1="14" x2="600" y2="22"/>
    <line x1="770" y1="40" x2="580" y2="34"/>
  </g>

  <!-- center eyecatch -->
  <g transform="translate(400,26)">
    <!-- left wing -->
    <rect x="-210" y="-14" width="120" height="4" fill="#141414"/>
    <polygon points="-90,-8 -70,0 -90,8" fill="#e60012"/>

    <!-- diamond mark -->
    <g class="s">
      <polygon points="0,-16 14,0 0,16 -14,0" fill="#e60012" stroke="#141414" stroke-width="2.5"/>
      <polygon points="0,-8 7,0 0,8 -7,0" fill="#f7f1e3"/>
    </g>

    <text class="disp" x="-108" y="7" text-anchor="end" fill="#141414" font-size="18" letter-spacing="5">EYECATCH</text>
    <text class="sans p" x="108" y="7" fill="#e60012" font-size="13" letter-spacing="3">COMMERCIAL BREAK</text>

    <!-- right wing -->
    <polygon points="90,-8 70,0 90,8" fill="#e60012" transform="translate(210,0) scale(-1,1) translate(-210,0)"/>
    <rect x="90" y="-14" width="120" height="4" fill="#141414"/>
  </g>

  <!-- thick ink borders -->
  <rect x="0" y="0" width="800" height="52" fill="none" stroke="#141414" stroke-width="5"/>
</svg>
