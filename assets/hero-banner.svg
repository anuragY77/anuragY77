<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Cyberpunk hero banner for Anurag Yadav">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56d4dd"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22d3ee"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyanBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#22d3ee" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#22d3ee" fill-opacity="0.18"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#56d4dd" fill-opacity="0.03"/>
    </pattern>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGreen" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="avatarClip">
      <circle cx="645" cy="125" r="58"/>
    </clipPath>
    <path id="textCirclePath" d="M555,125 a90,90 0 1,1 180,0 a90,90 0 1,1 -180,0"/>
  </defs>

  <style>
    .mono { font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace; }
    @keyframes ringPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.18); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .ring-a { animation: ringPulse 2.2s ease-in-out infinite; }
    .ring-b { animation: ringPulse 2.2s ease-in-out infinite 0.35s; }
    .ring-c { animation: ringPulse 2.2s ease-in-out infinite 0.7s; }
    .status-dot { animation: dotPulse 1.6s ease-in-out infinite; transform-origin: 686px 166px; }
    .cursor { animation: blink 1.05s step-end infinite; }
  </style>

  <!-- background -->
  <rect width="800" height="250" fill="#0d1117"/>
  <rect width="800" height="250" fill="url(#grid)"/>
  <rect width="800" height="250" fill="url(#scanlines)"/>
  <ellipse cx="180" cy="60" rx="220" ry="120" fill="url(#cyanBlob)"/>
  <ellipse cx="470" cy="210" rx="200" ry="110" fill="url(#purpleBlob)"/>
  <ellipse cx="645" cy="125" rx="130" ry="130" fill="url(#avatarGlow)"/>

  <!-- floating code syntax -->
  <g class="mono" fill="#56d4dd" font-size="11">
    <text x="34" y="34" opacity="0.22">def boot(profile): init()</text>
    <text x="330" y="30" opacity="0.18">{ neural_net: "online" }</text>
    <text x="430" y="52" fill="#c084fc" opacity="0.20">&lt;ai_agent state="RUN"/&gt;</text>
    <text x="34" y="236" opacity="0.16">01001101 01000001 01010100 01000001</text>
    <text x="300" y="238" fill="#c084fc" opacity="0.18">import future; build(); deploy()</text>
    <text x="455" y="232" opacity="0.15">// TODO: ship it</text>
    <text x="36" y="118" opacity="0.14">while(alive){ learn(); }</text>
    <text x="470" y="98" opacity="0.16">await connect(io)</text>
    <text x="340" y="76" fill="#c084fc" opacity="0.14">$ run --mode=cyberpunk</text>
    <text x="478" y="196" opacity="0.15">git push origin main</text>
    <text x="36" y="188" fill="#c084fc" opacity="0.13">SELECT * FROM dreams;</text>
    <text x="250" y="55" opacity="0.15">fn main() -> Result&lt;()&gt;</text>
    <text x="160" y="150" opacity="0.10">0xF F F  // hex_dump</text>
    <text x="380" y="140" opacity="0.12">pipeline.run(once=True)</text>
    <text x="50" y="70" fill="#c084fc" opacity="0.14">async fn neural()</text>
    <text x="210" y="210" opacity="0.12">[OK] edge_node_07</text>
    <animate attributeName="opacity" values="1;1" dur="1s" repeatCount="indefinite"/>
  </g>
  <g class="mono" font-size="11">
    <text x="330" y="30" fill="#56d4dd" opacity="0">
      { neural_net: "online" }
      <animate attributeName="opacity" values="0.06;0.22;0.06" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="52" fill="#c084fc" opacity="0">
      &lt;ai_agent state="RUN"/&gt;
      <animate attributeName="opacity" values="0.08;0.24;0.08" dur="6.5s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="455" y="232" fill="#56d4dd" opacity="0">
      // TODO: ship it
      <animate attributeName="opacity" values="0.05;0.2;0.05" dur="4.5s" begin="0.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#22d3ee" stroke-width="1.6" fill="none" opacity="0.75" filter="url(#glowSoft)">
    <path d="M18,44 L18,18 L60,18"/>
    <path d="M782,18 L782,44"/>
    <path d="M18,206 L18,232 L60,232"/>
    <path d="M782,232 L782,206"/>
  </g>
  <g stroke="#c084fc" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M740,18 L760,18"/>
    <path d="M760,232 L740,232"/>
  </g>

  <!-- left: identity block -->
  <text class="mono" x="48" y="52" fill="#22d3ee" font-size="12" letter-spacing="3" filter="url(#glowSoft)">[ SYSTEM.PROFILE_v2.6 ]</text>
  <text class="mono" x="46" y="104" fill="url(#titleGrad)" font-size="40" font-weight="700" letter-spacing="2" filter="url(#glowCyan)">ANURAG_YADAV</text>
  <rect x="48" y="116" width="330" height="2" fill="url(#accentLine)"/>
  <text class="mono" x="48" y="140" fill="#c084fc" font-size="13" letter-spacing="1.5" filter="url(#glowPurple)">FULL_STACK // DATA_ANALYTICS // AI_ML</text>
  <text class="mono" x="48" y="170" fill="#8b949e" font-size="12">&gt; neural_interface.boot() ......... <tspan fill="#3fb950">OK</tspan></text>
  <text class="mono" x="48" y="192" fill="#8b949e" font-size="12">&gt; status: <tspan fill="#3fb950">ONLINE</tspan><tspan class="cursor" fill="#56d4dd" dx="4">_</tspan></text>
  <text class="mono" x="48" y="216" fill="#56d4dd" font-size="11" opacity="0.8">@anuragY77 :: github.com</text>

  <!-- right: avatar HUD -->
  <g>
    <!-- pulsing rings -->
    <circle cx="645" cy="125" r="80" fill="none" stroke="#c084fc" stroke-width="1.2" class="ring-c" filter="url(#glowPurple)"/>
    <circle cx="645" cy="125" r="71" fill="none" stroke="#c084fc" stroke-width="1.6" class="ring-b" filter="url(#glowPurple)"/>
    <circle cx="645" cy="125" r="64" fill="none" stroke="#22d3ee" stroke-width="2" class="ring-a" filter="url(#glowCyan)"/>
    <circle cx="645" cy="125" r="59.5" fill="none" stroke="#56d4dd" stroke-width="1" opacity="0.9"/>

    <!-- rotating dashed ring -->
    <circle cx="645" cy="125" r="76" fill="none" stroke="#56d4dd" stroke-width="1.2" stroke-dasharray="3 9" opacity="0.65" filter="url(#glowSoft)">
      <animateTransform attributeName="transform" type="rotate" from="0 645 125" to="360 645 125" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- HUD tick marks -->
    <g stroke="#22d3ee" stroke-width="1.6" opacity="0.8" filter="url(#glowSoft)">
      <line x1="645" y1="34" x2="645" y2="44"/>
      <line x1="645" y1="206" x2="645" y2="216"/>
      <line x1="554" y1="125" x2="564" y2="125"/>
      <line x1="726" y1="125" x2="736" y2="125"/>
    </g>

    <!-- avatar image (base64 embedded) -->
    <circle cx="645" cy="125" r="58" fill="#161b22"/>
    <image href="data:image/jpeg;base64," x="587" y="67" width="116" height="116" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

    <!-- rotating text ring -->
    <text class="mono" font-size="11" fill="#56d4dd" letter-spacing="2.5" filter="url(#glowSoft)">
      <textPath href="#textCirclePath" startOffset="0%">SYSTEM.RUN() // AI_AGENT // NEURAL_NET // SYSTEM.RUN() // AI_AGENT // NEURAL_NET // SYSTEM.RUN() // AI_AGENT // NEURAL_NET //</textPath>
      <animate attributeName="startOffset" from="0%" to="100%" dur="20s" repeatCount="indefinite"/>
    </text>

    <!-- online status dot -->
    <g filter="url(#glowGreen)">
      <circle cx="686" cy="166" r="9" fill="#3fb950" fill-opacity="0.35" class="status-dot"/>
      <circle cx="686" cy="166" r="5.5" fill="#3fb950" class="status-dot"/>
      <circle cx="686" cy="166" r="2.2" fill="#e6ffef"/>
    </g>
  </g>

  <!-- bottom accent -->
  <rect x="0" y="247" width="800" height="3" fill="url(#accentLine)" opacity="0.8"/>
</svg>
