<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Anime opening: fireball impact, name slam, Yami katana dimension cut">
  <defs>
    <radialGradient id="fbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#fff3b0"/>
      <stop offset="40%" stop-color="#ffb347"/>
      <stop offset="65%" stop-color="#ff6b1a"/>
      <stop offset="85%" stop-color="#e01b24"/>
      <stop offset="100%" stop-color="#e01b24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#ff3b5c" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ff3b5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="impactStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slashWhite" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7df9ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="45%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="hot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", "Segoe UI Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-4px,3px); } 50% { transform: translate(3px,-3px); } 75% { transform: translate(-2px,2px); } }
    .shk { animation: shake .35s ease-in-out 3; }
    @keyframes flick { 0%,100% { opacity:.9; } 50% { opacity:.55; } }
    .fl { animation: flick .18s steps(2) infinite; }
  </style>

  <rect width="800" height="320" fill="#050508"/>

  <g fill="#ffffff" opacity=".04">
    <circle cx="40" cy="40" r="1.4"/><circle cx="80" cy="40" r="1.4"/><circle cx="120" cy="40" r="1.4"/><circle cx="160" cy="40" r="1.4"/>
    <circle cx="60" cy="80" r="1.4"/><circle cx="100" cy="80" r="1.4"/><circle cx="140" cy="80" r="1.4"/><circle cx="180" cy="80" r="1.4"/>
    <circle cx="40" cy="120" r="1.4"/><circle cx="80" cy="120" r="1.4"/><circle cx="120" cy="120" r="1.4"/><circle cx="160" cy="120" r="1.4"/>
    <circle cx="640" cy="40" r="1.4"/><circle cx="680" cy="40" r="1.4"/><circle cx="720" cy="40" r="1.4"/><circle cx="760" cy="40" r="1.4"/>
    <circle cx="660" cy="80" r="1.4"/><circle cx="700" cy="80" r="1.4"/><circle cx="740" cy="80" r="1.4"/><circle cx="780" cy="80" r="1.4"/>
    <circle cx="640" cy="240" r="1.4"/><circle cx="680" cy="240" r="1.4"/><circle cx="720" cy="240" r="1.4"/><circle cx="760" cy="240" r="1.4"/>
    <circle cx="40" cy="240" r="1.4"/><circle cx="80" cy="240" r="1.4"/><circle cx="120" cy="240" r="1.4"/><circle cx="160" cy="240" r="1.4"/>
  </g>

  <g stroke="#ffffff" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;.85;.7" keyTimes="0;.45;.55;1" dur="2.2s" begin="0.35s" fill="freeze"/>
    <line x1="400" y1="140" x2="40" y2="20" stroke-width="3"/>
    <line x1="400" y1="140" x2="40" y2="90" stroke-width="2.5"/>
    <line x1="400" y1="140" x2="40" y2="160" stroke-width="3"/>
    <line x1="400" y1="140" x2="40" y2="230" stroke-width="2.5"/>
    <line x1="400" y1="140" x2="40" y2="300" stroke-width="3"/>
    <line x1="400" y1="140" x2="200" y2="310" stroke-width="2"/>
    <line x1="400" y1="140" x2="360" y2="315" stroke-width="2.5"/>
    <line x1="400" y1="140" x2="520" y2="315" stroke-width="2"/>
    <line x1="400" y1="140" x2="700" y2="310" stroke-width="2.5"/>
    <line x1="400" y1="140" x2="760" y2="240" stroke-width="3"/>
    <line x1="400" y1="140" x2="770" y2="170" stroke-width="2"/>
    <line x1="400" y1="140" x2="770" y2="100" stroke-width="2.5"/>
    <line x1="400" y1="140" x2="760" y2="30" stroke-width="3"/>
    <line x1="400" y1="140" x2="600" y2="8" stroke-width="2"/>
    <line x1="400" y1="140" x2="460" y2="6" stroke-width="2.5"/>
    <line x1="400" y1="140" x2="260" y2="8" stroke-width="2"/>
    <line x1="400" y1="140" x2="120" y2="30" stroke-width="2.5"/>
    <line x1="400" y1="140" x2="760" y2="70" stroke-width="2"/>
    <line x1="400" y1="140" x2="760" y2="280" stroke-width="2"/>
    <line x1="400" y1="140" x2="60" y2="50" stroke-width="2"/>
    <line x1="400" y1="140" x2="60" y2="270" stroke-width="2"/>
  </g>

  <g>
    <circle cx="240" cy="150" r="40" fill="none" stroke="#ff6b1a" stroke-width="4" opacity="0">
      <animate attributeName="r" values="40;320" dur="1s" begin="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values=".9;0" dur="1s" begin="0.3s" fill="freeze"/>
      <animate attributeName="stroke-width" values="6;1" dur="1s" begin="0.3s" fill="freeze"/>
    </circle>
    <circle cx="240" cy="150" r="40" fill="none" stroke="#ffd54f" stroke-width="3" opacity="0">
      <animate attributeName="r" values="30;260" dur=".9s" begin="0.45s" fill="freeze"/>
      <animate attributeName="opacity" values=".8;0" dur=".9s" begin="0.45s" fill="freeze"/>
    </circle>
    <g filter="url(#soft)">
      <circle cx="240" cy="150" r="0" fill="url(#fbGlow)">
        <animate attributeName="r" values="0;150;130;145;135" dur="1.4s" begin="0.25s" fill="freeze"/>
      </circle>
      <circle cx="240" cy="150" r="0" fill="url(#fbCore)">
        <animate attributeName="r" values="0;110;95;105;98" dur="1.4s" begin="0.25s" fill="freeze"/>
      </circle>
    </g>
    <g fill="#ff6b1a" class="fl">
      <path d="M140,90 Q130,50 160,55 Q170,25 200,50 Q230,20 250,55 Q290,40 285,80 Q310,90 295,120" opacity=".7"/>
      <path d="M100,160 Q70,140 95,120 Q80,90 120,95" opacity=".5"/>
      <path d="M300,100 Q340,90 330,130 Q360,150 335,180" opacity=".55"/>
    </g>
    <g opacity="0" filter="url(#hot)">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.4;.7;1" dur="1.6s" begin="0.3s" fill="freeze"/>
      <polygon points="240,60 255,130 320,110 265,150 310,200 245,165 220,230 225,160 155,190 215,148 160,100 228,132" fill="url(#impactStar)"/>
      <polygon points="240,85 250,135 295,125 255,150 285,185 245,160 230,205 232,158 185,178 225,148 185,115 234,138" fill="#ffffff" opacity=".85"/>
    </g>
    <g fill="#ffd54f">
      <circle cx="350" cy="80" r="3" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2s" begin=".8s" fill="freeze"/><animate attributeName="cx" values="350;420" dur="2s" begin=".8s" fill="freeze"/><animate attributeName="cy" values="80;40" dur="2s" begin=".8s" fill="freeze"/></circle>
      <circle cx="340" cy="220" r="2.5" fill="#ff6b1a" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1s" fill="freeze"/><animate attributeName="cx" values="340;410" dur="2.2s" begin="1s" fill="freeze"/></circle>
      <circle cx="130" cy="250" r="2" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.1s" fill="freeze"/><animate attributeName="cy" values="250;190" dur="1.8s" begin="1.1s" fill="freeze"/></circle>
      <circle cx="400" cy="60" r="2.5" fill="#e01b24" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.2s" fill="freeze"/><animate attributeName="cx" values="400;470" dur="2s" begin="1.2s" fill="freeze"/></circle>
    </g>
  </g>

  <rect width="800" height="320" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;.92;0;0" keyTimes="0;.28;.34;.42;1" dur=".6s" begin="0.28s" fill="freeze"/>
  </rect>

  <g class="shk" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".01s" begin="0.7s" fill="freeze"/>
    <text class="disp" x="48" y="168" font-size="64" letter-spacing="2" fill="#1a0000" stroke="#1a0000" stroke-width="14" stroke-linejoin="round" style="paint-order:stroke fill">ANURAG YADAV</text>
    <text class="disp" x="44" y="164" font-size="64" letter-spacing="2" fill="url(#nameGold)" stroke="#3e1a00" stroke-width="6" stroke-linejoin="round" style="paint-order:stroke fill" filter="url(#hot)">ANURAG YADAV</text>
    <text class="disp" x="44" y="164" font-size="64" letter-spacing="2" fill="none" stroke="#fffde7" stroke-width="1.5" opacity=".8">ANURAG YADAV</text>
    <animateTransform attributeName="transform" type="scale" values="1.6;0.96;1.02;1" keyTimes="0;0.5;0.75;1" dur=".45s" begin="0.7s" fill="freeze" additive="sum"/>
    <animateTransform attributeName="transform" type="translate" values="80 40;0 0" dur=".45s" begin="0.7s" fill="freeze" additive="sum"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.15s" fill="freeze"/>
    <rect x="46" y="178" width="420" height="5" fill="#e01b24" transform="skewX(-20)"/>
    <text class="sans" x="52" y="212" font-size="16" font-weight="700" fill="#f5f5f5" letter-spacing="4" font-style="italic">FULL-STACK DEVELOPER  ·  AI BUILDER  ·  DATA ENGINEER</text>
    <text class="sans" x="52" y="240" font-size="14" fill="#ffd54f" letter-spacing="2" font-style="italic">"I never go back on my word — that is my ninja way."</text>
    <text class="sans" x="52" y="268" font-size="13" fill="#b0b0b8" letter-spacing="1">SEASON 2026  ·  THE HERO KEEPS BUILDING  ·  NEVER GIVE UP</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.3s" fill="freeze"/>
    <g transform="translate(52,28) skewX(-12)">
      <rect width="130" height="30" fill="#e01b24"/>
      <text class="disp" x="65" y="22" text-anchor="middle" fill="#ffffff" font-size="15" letter-spacing="3">NOW AIRING</text>
    </g>
    <circle cx="196" cy="43" r="6" fill="#e01b24" class="fl"/>
    <text class="sans" x="212" y="48" fill="#ffd54f" font-size="13" font-weight="700" letter-spacing="2">EP. 2026 — SEASON FINALE</text>
  </g>

  <g>
    <line x1="-60" y1="320" x2="60" y2="200" stroke="url(#slashWhite)" stroke-width="6" stroke-linecap="round" opacity="0" filter="url(#hot)">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.7;1" dur=".55s" begin="1.7s" fill="freeze"/>
      <animate attributeName="x1" values="-60;860" dur=".4s" begin="1.7s" fill="freeze"/>
      <animate attributeName="y1" values="320;-80" dur=".4s" begin="1.7s" fill="freeze"/>
      <animate attributeName="x2" values="60;980" dur=".4s" begin="1.7s" fill="freeze"/>
      <animate attributeName="y2" values="200;-200" dur=".4s" begin="1.7s" fill="freeze"/>
    </line>
    <rect width="800" height="320" fill="#e8fbff" opacity="0">
      <animate attributeName="opacity" values="0;.55;0" keyTimes="0;.4;1" dur=".35s" begin="1.85s" fill="freeze"/>
    </rect>
    <line x1="0" y1="300" x2="800" y2="20" stroke="#7df9ff" stroke-width="2" opacity="0" filter="url(#hot)">
      <animate attributeName="opacity" values="0;1;.55;.8" keyTimes="0;.3;.6;1" dur=".8s" begin="1.9s" fill="freeze"/>
      <animate attributeName="opacity" values=".8;.3;.7;.3;.6" dur="3.5s" begin="2.7s" repeatCount="indefinite"/>
    </line>
    <g fill="#7df9ff" opacity="0">
      <animate attributeName="opacity" values="0;1;.5" keyTimes="0;.5;1" dur=".6s" begin="2s" fill="freeze"/>
      <polygon points="300,180 320,170 310,195"/>
      <polygon points="500,120 525,110 510,135"/>
      <polygon points="680,70 700,60 690,85"/>
      <polygon points="150,240 175,230 160,255"/>
    </g>
    <text class="disp" x="400" y="300" text-anchor="middle" fill="#7df9ff" font-size="22" letter-spacing="8" font-style="italic" opacity="0" filter="url(#hot)">
      DIMENSION CUT
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="2s" fill="freeze"/>
    </text>
  </g>

  <rect x="0" y="308" width="800" height="12" fill="#000000"/>
  <rect x="0" y="0" width="800" height="8" fill="#000000"/>
</svg>
