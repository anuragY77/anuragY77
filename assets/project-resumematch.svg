<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="ResumeMatch AI project card — Hunter x Hunter mode">
  <defs>
    <pattern id="rmTone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141414" opacity=".08"/>
    </pattern>
    <filter id="rmInk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <style>
    .disp { font-family: Impact, "Arial Black", sans-serif; }
    .sans { font-family: "Segoe UI", Arial, sans-serif; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 1.6s ease-in-out infinite; }
  </style>

  <rect width="800" height="200" fill="#f7f1e3"/>
  <rect width="800" height="200" fill="url(#rmTone)"/>

  <polygon points="0,0 250,0 210,200 0,200" fill="#2e7d32"/>
  <g stroke="#141414" stroke-width="3" opacity=".25" stroke-linecap="round">
    <line x1="20" y1="30" x2="200" y2="50"/>
    <line x1="10" y1="90" x2="190" y2="100"/>
    <line x1="20" y1="150" x2="180" y2="155"/>
  </g>

  <!-- Hunter x Hunter license emblem -->
  <g transform="translate(110,100)" class="pop">
    <circle r="52" fill="#f7f1e3" stroke="#141414" stroke-width="5"/>
    <rect x="-34" y="-26" width="68" height="52" rx="5" fill="#e8f5e9" stroke="#141414" stroke-width="3.5"/>
    <rect x="-34" y="-26" width="68" height="14" fill="#2e7d32" stroke="#141414" stroke-width="2.5"/>
    <text class="disp" x="0" y="-15" text-anchor="middle" fill="#ffffff" font-size="9" letter-spacing="2">LICENSE</text>
    <!-- hunter star -->
    <path d="M0,-4 L5,6 L16,7 L8,15 L10,26 L0,20 L-10,26 L-8,15 L-16,7 L-5,6 Z" fill="#ffd166" stroke="#141414" stroke-width="2.5" transform="scale(0.9) translate(0,4)"/>
    <path d="M-24,-2 L-10,-2 M-24,6 L-14,6 M-24,14 L-8,14" stroke="#141414" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <path d="M10,-2 L24,-2 M14,6 L24,6" stroke="#141414" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  </g>
  <text class="disp" x="110" y="178" text-anchor="middle" fill="#141414" font-size="13" letter-spacing="3">HUNTER x HUNTER MODE</text>

  <g transform="translate(700,28) rotate(-8)">
    <rect x="-78" y="-15" width="156" height="30" fill="#2e7d32" stroke="#141414" stroke-width="3"/>
    <text class="disp" x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="13" letter-spacing="1">EXPLAINED MATCHING</text>
  </g>

  <text class="disp" x="280" y="72" fill="#141414" font-size="36" letter-spacing="1">ResumeMatch AI</text>
  <rect x="280" y="82" width="260" height="5" fill="#2e7d32"/>

  <text class="sans" x="280" y="112" fill="#141414" font-size="14" font-weight="600">Resume-to-JD fit engine with real embedding scoring — not an LLM wrapper.</text>

  <g transform="translate(280,126)" filter="url(#rmInk)">
    <rect width="460" height="40" rx="18" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <polygon points="20,40 8,58 48,42" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <text class="sans" x="230" y="26" text-anchor="middle" fill="#141414" font-size="14" font-style="italic" font-weight="700">"Pass the Hunter License — the right fit, no false clears."</text>
  </g>

  <g class="sans" font-size="11" font-weight="700">
    <g transform="translate(280,178)"><rect width="64" height="16" fill="#141414"/><text x="32" y="12" text-anchor="middle" fill="#f7f1e3">Next.js</text></g>
    <g transform="translate(352,178)"><rect width="56" height="16" fill="#141414"/><text x="28" y="12" text-anchor="middle" fill="#f7f1e3">FastAPI</text></g>
    <g transform="translate(416,178)"><rect width="130" height="16" fill="#141414"/><text x="65" y="12" text-anchor="middle" fill="#f7f1e3">sentence-transformers</text></g>
    <g transform="translate(554,178)"><rect width="80" height="16" fill="#141414"/><text x="40" y="12" text-anchor="middle" fill="#f7f1e3">PostgreSQL</text></g>
  </g>

  <rect x="3" y="3" width="794" height="194" fill="none" stroke="#141414" stroke-width="7"/>
</svg>
