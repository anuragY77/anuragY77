name: Update Contribution Calendar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-contribution-calendar.mjs"
      - "scripts/generate-activity-graph.mjs"
      - "scripts/generate-profile-stats.mjs"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate contribution calendar SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-contribution-calendar.mjs

      - name: Generate activity graph SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-activity-graph.mjs

      - name: Generate profile stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-profile-stats.mjs

      - name: Cache-bust image URLs in README
        run: |
          V=$(date +%s)
          sed -i "s|contribution-calendar.svg[^\"']*|contribution-calendar.svg?v=${V}|g" README.md
          sed -i "s|activity-graph.svg[^\"']*|activity-graph.svg?v=${V}|g" README.md
          sed -i "s|profile-stats.svg[^\"']*|profile-stats.svg?v=${V}|g" README.md

      - name: Commit if changed
        run: |
          git config user.name "anuragY77"
          git config user.email "207905918+anuragY77@users.noreply.github.com"
          git add assets/contribution-calendar.svg assets/activity-graph.svg assets/profile-stats.svg README.md || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh contribution graph + calendar"
            git push
          fi
